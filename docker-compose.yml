services:
  web:
    build: .
    container_name: rag-ai-tutor-web
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
      - UPLOAD_DIR=/app/uploads
      - ALLOWED_ORIGINS=*
    env_file:
      - .env
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./uploads:/app/uploads
      - ./database:/app/database
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: rag-ai-tutor-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
