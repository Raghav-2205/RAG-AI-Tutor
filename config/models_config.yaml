# backend/config/models_config.yaml
# AI Model configurations

embeddings:
  model: "all-MiniLM-L6-v2"  # Fast, 384-dim
  alternatives:
    - name: "all-mpnet-base-v2"
      dims: 768
    - name: "BAAI/bge-small-en-v1.5"
      dims: 384

llm:
  primary: "gemini-1.5-flash"
  alternatives:
    - name: "gemini-1.5-pro"
      context_window: 2000000
    - name: "gpt-4o-mini"  # OpenAI fallback

quiz:
  difficulty_levels:
    easy: { temperature: 0.3, max_options: 4 }
    medium: { temperature: 0.5, max_options: 4 }
    hard: { temperature: 0.7, max_options: 4 }
