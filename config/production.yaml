# backend/config/production.yaml
# Production deployment settings

debug: false
log_level: "INFO"

# MongoDB Atlas
mongodb:
  uri: "mongodb+srv://username:password@cluster.mongodb.net/rag_tutor_prod"
  db_name: "rag_tutor_prod"

# ChromaDB (Docker volume)
chromadb:
  path: "./chroma_db_prod"
  persist_directory: "/app/chroma_db_prod"

# Gemini production keys
gemini:
  api_key: "${GEMINI_API_KEY}"  # Set as env var
  model: "gemini-1.5-pro"
  temperature: 0.3

# Stricter upload limits
upload:
  max_size_mb: 25
  allowed_types: ["application/pdf"]

# Production CORS
cors:
  origins: ["https://yourdomain.com"]

# Rate limiting
rate_limit:
  requests_per_minute: 60
