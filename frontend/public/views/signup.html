<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sign Up - RAG AI Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/assets/js/theme-init.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/app-shell.css" />
  <script src="/assets/js/theme-controls.js"></script>
</head>

<body class="auth-page">
  <div class="auth-topbar">
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>
  </div>

  <div class="auth-card">
    <div class="auth-brand"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>
    <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); font-family: var(--font-display);">Create an Account</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 32px;">Join the RAG AI Tutor platform today.</p>

    <form onsubmit="handleSignup(event)" class="auth-form">
      <div>
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">Full Name</label>
        <input type="text" id="signupName" placeholder="John Doe" required class="theme-input" />
      </div>
      <div>
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required class="theme-input" />
      </div>
      <div>
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">Roll Number</label>
        <input type="text" id="signupRollNumber" placeholder="Optional academic ID" class="theme-input" />
      </div>
      <div>
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">Password</label>
        <input type="password" id="signupPassword" placeholder="Create a password" required class="theme-input" />
      </div>
      <button type="submit" class="btn" style="width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; margin-top: 8px;">Sign Up</button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="/views/login.html">Click here.</a>
    </p>
  </div>

  <script src="/assets/js/config.js?v=11"></script>
  <script src="/assets/js/route-guard.js?v=2"></script>
  <script src="/assets/js/auth.js?v=9"></script>
</body>

</html>
