<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login - RAG AI Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body>
  <nav class="navbar">
    <div class="brand">🚀 RAG AI Tutor</div>
    <div class="nav-links">
      <a href="/" class="nav-button">Home</a>
      <a href="/views/signup.html" class="nav-button">Sign Up</a>
    </div>
  </nav>

  <main>
    <section class="auth-container">
      <div class="auth-card">
        <h2>Login to RAG AI</h2>

        <form onsubmit="handleLogin(event)">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input type="password" id="loginPassword" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="/views/signup.html">Sign up</a>
        </p>
      </div>
    </section>
  </main>

  <script src="/assets/js/config.js?v=7"></script>
  <script src="/assets/js/auth.js?v=7"></script>
</body>

</html>
