<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login - RAG AI Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/assets/js/theme-init.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/app-shell.css" />
  <script src="/assets/js/theme-controls.js"></script>
</head>

<body class="auth-page">
  <div class="auth-topbar">
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>
  </div>

  <div class="auth-card">
    <div class="auth-brand"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>
    <div class="auth-header">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Enter your credentials to access your account.</p>
    </div>

    <form onsubmit="handleLogin(event)" class="auth-form">
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required class="theme-input" />
      </div>
      <div class="auth-field">
        <label class="auth-label">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required class="theme-input" />
      </div>
      <button type="submit" class="btn btn-primary auth-submit">Sign In</button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a href="/views/signup.html">Click here.</a>
    </p>
  </div>

  <script src="/assets/js/config.js?v=11"></script>
  <script src="/assets/js/route-guard.js?v=2"></script>
  <script src="/assets/js/auth.js?v=9"></script>
</body>

</html>
