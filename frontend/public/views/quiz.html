<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - RAG AI Tutor</title>
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script>
        // Apply saved theme immediately to prevent FOUC
        (function () {
            var t = localStorage.getItem('lms_theme') || 'light';
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <script src="/assets/js/auth.js?v=9"></script>
</head>


<body>
    <div class="page-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>
                <span>RAG AI Tutor</span>
            </div>
            <nav class="nav-section">
                <div class="nav-label">Learn</div>
                <a href="/views/dashboard.html" class="nav-item ">
                    <span class="nav-icon sidebar-c1"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></span>
                    Dashboard
                </a>
                <a href="/views/lms.html?allow_student=1&amp;page=classes" class="nav-item ">
                    <span class="nav-icon sidebar-c2"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span> My
                    Classes
                </a>
                <a href="/views/subjects.html" class="nav-item ">
                    <span class="nav-icon sidebar-c3"><i class="fa-solid fa-comments" aria-hidden="true"></i></span> AI
                    Tutor Chat
                </a>
                <a href="/views/planner.html" class="nav-item ">
                    <span class="nav-icon sidebar-c4"><i class="fa-regular fa-calendar" aria-hidden="true"></i></span>
                    Planner
                </a>
                <a href="/views/tracking.html" class="nav-item ">
                    <span class="nav-icon sidebar-c5"><i class="fa-solid fa-person-running"
                            aria-hidden="true"></i></span> Activity Tracking
                </a>
                <a href="/views/community.html" class="nav-item ">
                    <span class="nav-icon sidebar-c6"><i class="fa-solid fa-users" aria-hidden="true"></i></span>
                    Community
                </a>
            </nav>
            <nav class="nav-section">
                <div class="nav-label">Analytics</div>
                <a href="/views/analytics.html" class="nav-item ">
                    <span class="nav-icon sidebar-c1"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i></span>
                    Analytics
                </a>
                <a href="/views/evaluation.html" class="nav-item ">
                    <span class="nav-icon sidebar-c2"><i class="fa-solid fa-clipboard-check"
                            aria-hidden="true"></i></span> Evaluation
                </a>
                <a href="/views/progress.html" class="nav-item ">
                    <span class="nav-icon sidebar-c3"><i class="fa-regular fa-clipboard" aria-hidden="true"></i></span>
                    Progress Report
                </a>
                <a href="/views/calendar.html" class="nav-item ">
                    <span class="nav-icon sidebar-c4"><i class="fa-solid fa-calendar-days"
                            aria-hidden="true"></i></span> Unified Calendar
                </a>
            </nav>
            <nav class="nav-section">
                <div class="nav-label">Account</div>
                <a href="/views/profile.html" class="nav-item ">
                    <span class="nav-icon sidebar-c6"><i class="fa-regular fa-user" aria-hidden="true"></i></span>
                    Profile &amp; Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">?</div>
                    <div>
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-level" id="userLevel">Student</div>
                    </div>
                </div>
                <div style="margin-top:10px;">
                    <a href="#"
                        onclick="window.auth ? window.auth.logout() : (localStorage.clear(), window.location.href='/views/login.html')"
                        class="nav-item" style="margin-bottom:0;padding:8px 4px;font-size:13px;">
                        <span class="nav-icon sidebar-c5"><i class="fa-solid fa-right-from-bracket"
                                aria-hidden="true"></i></span> Logout
                    </a>
                </div>
                <div style="margin-top:8px; padding: 0 4px;">
                    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme"
                        style="width:100%;justify-content:center;">
                        <i class="fa-solid fa-moon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </aside>

        <main class="main">
            <div class="container">
                <div id="quizContent">
                    <!-- Loading state -->
                    <div class="loading" id="loadingState">
                        <div class="loader"></div>
                        <p>Generating your personalized quiz...</p>
                    </div>
                </div>
            </div>

            <script src="../assets/js/config.js?v=11"></script>
            <script>
                let quizData = null;
                let currentQuestion = 0;
                let answers = [];
                let quizResult = null;
                let timerInterval = null;

                function startTimer(minutes) {
                    let secondsLeft = minutes * 60;
                    timerInterval = setInterval(() => {
                        secondsLeft--;
                        if (secondsLeft <= 0) {
                            clearInterval(timerInterval);
                            alert("Time's up! Submitting automatically.");
                            submitQuiz();
                            return;
                        }
                        const m = Math.floor(secondsLeft / 60);
                        const s = secondsLeft % 60;
                        const timerEl = document.getElementById('quizTimer');
                        if (timerEl) timerEl.textContent = `⏱️ ${m}:${s.toString().padStart(2, '0')}`;
                    }, 1000);
                }

                // Check authentication
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = '/views/login.html';
                }

                // Load quiz on page load
                window.addEventListener('DOMContentLoaded', async () => {
                    await loadQuiz();
                });

                async function loadQuiz() {
                    try {
                        const apiBase = window.config?.apiBase || (window.location.origin + '/api');
                        const urlParams = new URLSearchParams(window.location.search);
                        const quizId = urlParams.get('quiz_id');

                        let response;
                        if (quizId) {
                            // Fetch specific LMS quiz
                            response = await fetch(`${apiBase}/lms/quizzes/${quizId}`, {
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                        } else {
                            // Generate AI diagnostic quiz
                            response = await fetch(`${apiBase}/quiz/generate`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}`
                                },
                                body: JSON.stringify({
                                    subject: 'general',
                                    num_questions: 10
                                })
                            });
                        }

                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.detail || 'Failed to load quiz');
                        }

                        quizData = await response.json();
                        answers = new Array(quizData.questions.length).fill(null);

                        renderQuiz();

                        if (quizData.time_limit) {
                            startTimer(quizData.time_limit);
                        }

                    } catch (error) {
                        document.getElementById('quizContent').innerHTML = `
                    <div class="question-card" style="text-align: center;">
                        <h2 style="color: #ff6b6b; margin-bottom: 1rem;">❌ Error Loading Quiz</h2>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="window.location.href='/views/dashboard.html'" style="margin-top: 2rem;">
                            Back to Dashboard
                        </button>
                    </div>
                `;
                    }
                }

                function renderQuiz() {
                    if (!quizData || !quizData.questions || quizData.questions.length === 0) {
                        document.getElementById('quizContent').innerHTML = `
                    <div class="question-card" style="text-align: center;">
                        <h2 style="color: #ff6b6b; margin-bottom: 1rem;">❌ No Questions Available</h2>
                        <p>The system could not generate questions from the current content.</p>
                        <button class="btn btn-primary" onclick="window.location.href='/views/subjects.html'" style="margin-top: 2rem;">
                            Return to Dashboard
                        </button>
                    </div>
                `;
                        return;
                    }

                    const question = quizData.questions[currentQuestion];
                    const progress = ((currentQuestion + 1) / quizData.questions.length) * 100;

                    document.getElementById('quizContent').innerHTML = `
                <div class="quiz-header">
                    <h1>Knowledge Assessment</h1>
                    <div class="level-badge level-beginner">Diagnostic Quiz</div>
                </div>

                <div class="progress-text">
                    Question ${currentQuestion + 1} of ${quizData.questions.length} 
                    <span id="quizTimer" style="float:right; color:#ffc107;"></span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%"></div>
                </div>

                <div class="question-card">
                    <div class="question-text">${question.question}</div>
                    <div class="options">
                        ${question.options.map((option, index) => `
                            <div class="option ${answers[currentQuestion] === index ? 'selected' : ''}" 
                                 onclick="selectAnswer(${index})">
                                <div class="option-letter">${String.fromCharCode(65 + index)}</div>
                                <div>${typeof option === 'object' ? (option.text ?? option.label ?? '') : option}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="quiz-actions">
                    <button class="btn btn-secondary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
                        ← Previous
                    </button>
                    ${currentQuestion < quizData.questions.length - 1
                            ? `<button class="btn btn-primary" onclick="nextQuestion()" ${answers[currentQuestion] === null ? 'disabled' : ''}>
                            Next →
                           </button>`
                            : `<button class="btn btn-primary" onclick="submitQuiz()" ${answers[currentQuestion] === null ? 'disabled' : ''}>
                            Submit Quiz
                           </button>`
                        }
                </div>
            `;
                }

                function selectAnswer(index) {
                    answers[currentQuestion] = index;
                    renderQuiz();
                }

                function nextQuestion() {
                    if (currentQuestion < quizData.questions.length - 1) {
                        currentQuestion++;
                        renderQuiz();
                        window.scrollTo(0, 0);
                    }
                }

                function previousQuestion() {
                    if (currentQuestion > 0) {
                        currentQuestion--;
                        renderQuiz();
                        window.scrollTo(0, 0);
                    }
                }

                async function submitQuiz() {
                    if (timerInterval) clearInterval(timerInterval);
                    if (answers.includes(null) && !window.confirm("You have unanswered questions. Submit anyway?")) {
                        if (quizData.time_limit) startTimer(Math.max(1, quizData.time_limit)); // rough resume
                        return;
                    }

                    document.getElementById('quizContent').innerHTML = `
                <div class="loading">
                    <div class="loader"></div>
                    <p>Evaluating your answers...</p>
                </div>
            `;

                    try {
                        const apiBase = window.config?.apiBase || (window.location.origin + '/api');
                        const urlParams = new URLSearchParams(window.location.search);
                        const quizId = urlParams.get('quiz_id') || quizData.quiz_id;

                        // Format answers for LMS: { "question_id": "label", ... }
                        const formattedAnswers = {};
                        quizData.questions.forEach((q, i) => {
                            const selectedIdx = answers[i];
                            // If it's an LMS quiz, we use question ID. If AI quiz, we might just use index if ID missing.
                            const qId = q.id || i;
                            const label = String.fromCharCode(65 + selectedIdx); // Assuming A, B, C, D labels
                            formattedAnswers[qId] = label;
                        });

                        let response;
                        if (urlParams.get('quiz_id')) {
                            // LMS Submit
                            response = await fetch(`${apiBase}/lms/quizzes/${quizId}/attempt`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ answers: formattedAnswers })
                            });
                        } else {
                            // AI Submit (Original logic)
                            response = await fetch(`${apiBase}/quiz/submit`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}`
                                },
                                body: JSON.stringify({
                                    quiz_id: quizData.quiz_id,
                                    answers: answers
                                })
                            });
                        }

                        if (!response.ok) {
                            throw new Error('Failed to submit quiz');
                        }

                        quizResult = await response.json();

                        // If LMS response doesn't match the old result format, adapt it
                        if (!quizResult.level) quizResult.level = quizResult.percentage > 80 ? 'Advanced' : 'Intermediate';
                        if (!quizResult.feedback) quizResult.feedback = `You scored ${quizResult.score} out of ${quizResult.max_score}. Great effort!`;
                        if (!quizResult.total) quizResult.total = quizResult.max_score;

                        renderResults();

                    } catch (error) {
                        alert(`Error: ${error.message}`);
                        renderQuiz();
                    }
                }

                function hasReviewResults() {
                    if (Array.isArray(quizResult?.question_results) && quizResult.question_results.length > 0) {
                        return true;
                    }
                    return Array.isArray(quizResult?.correct_answers) && quizResult.correct_answers.length > 0;
                }

                function getQuestionReviewResult(index) {
                    if (Array.isArray(quizResult?.question_results) && quizResult.question_results[index]) {
                        return quizResult.question_results[index];
                    }

                    if (Array.isArray(quizResult?.correct_answers) && quizResult.correct_answers.length > index) {
                        return {
                            correct_answers: [quizResult.correct_answers[index]],
                            is_correct: answers[index] === quizResult.correct_answers[index],
                        };
                    }

                    return null;
                }

                function renderResults() {
                    const levelClass = `level-${quizResult.level.toLowerCase()}`;

                    document.getElementById('quizContent').innerHTML = `
                <div class="results-container">
                    <div class="quiz-header">
                        <h1>🎉 Quiz Complete!</h1>
                    </div>

                    <div class="score-circle">
                        <div>${quizResult.score}/${quizResult.total}</div>
                        <div class="percentage">${quizResult.percentage.toFixed(0)}%</div>
                    </div>

                    <div class="level-badge ${levelClass}">
                        Level: ${quizResult.level}
                    </div>

                    <div class="feedback-message">
                        ${quizResult.feedback}
                    </div>

                    ${quizResult.weak_topics && quizResult.weak_topics.length > 0 ? `
                        <div class="weak-topics">
                            <h3>📚 Areas to Review:</h3>
                            ${quizResult.weak_topics.map(topic => `
                                <span class="topic-tag">${topic}</span>
                            `).join('')}
                        </div>
                    ` : ''}

                    <div class="results-actions">
                        <button id="reviewAnswersBtn" class="btn btn-secondary" onclick="showReview()">
                            📝 Review Answers
                        </button>
                        <button class="btn btn-primary" onclick="window.location.reload()">
                            🔄 Retake Quiz
                        </button>
                        <button class="btn btn-primary" onclick="window.location.href='/views/subjects.html'">
                            💬 Chat with AI Tutor
                        </button>
                    </div>

                    <!-- QUIZ FEEDBACK -->
                    <div class="quiz-feedback-section" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                        <h3 style="text-align: center; margin-bottom: 1.5rem; color: var(--accent);">📊 How was this quiz?</h3>
                        <div id="quizFeedbackContainer" style="max-width: 500px; margin: 0 auto;">
                            <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem;">
                                ${[1, 2, 3, 4, 5].map(star => `
                                    <button class="star-btn" data-rating="${star}" onclick="selectQuizRating(${star})" 
                                            style="background: var(--bg-secondary); border: 2px solid rgba(255, 255, 255, 0.2); 
                                                   padding: 1rem; border-radius: 12px; cursor: pointer; font-size: 2rem; transition: all 0.2s;">
                                        ⭐
                                    </button>
                                `).join('')}
                            </div>
                            <textarea id="quizFeedbackComment" placeholder="Share your thoughts about this quiz (optional)..." 
                                      style="width: 100%; background: var(--bg-secondary); border: 1px solid rgba(255, 255, 255, 0.2); 
                                             padding: 1rem; border-radius: 12px; color: #fff; min-height: 100px; margin-bottom: 1rem; resize: vertical;"></textarea>
                            <button id="submitQuizFeedbackBtn" onclick="submitQuizFeedback()" disabled
                                    style="width: 100%; background: linear-gradient(135deg, var(--accent), #00d4aa); color: #0f0c29; 
                                           padding: 1rem; border-radius: 12px; border: none; font-weight: 600; cursor: not-allowed; opacity: 0.5; transition: all 0.3s;">
                                Submit Feedback
                            </button>
                        </div>
                    </div>
                </div>
            `;

                    if (!hasReviewResults()) {
                        document.getElementById('reviewAnswersBtn')?.remove();
                    }
                }

                function showReview() {
                    if (!hasReviewResults()) {
                        renderResults();
                        return;
                    }

                    let reviewHTML = '<div class="review-answers"><h2 style="text-align:center; margin-bottom: 2rem;">📝 Answer Review</h2>';

                    quizData.questions.forEach((question, index) => {
                        const userAnswer = answers[index];
                        const reviewResult = getQuestionReviewResult(index);
                        const correctAnswers = Array.isArray(reviewResult?.correct_answers) ? reviewResult.correct_answers : [];
                        const isCorrect = reviewResult ? !!reviewResult.is_correct : false;

                        reviewHTML += `
                    <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                        <div style="font-weight: 600; margin-bottom: 0.5rem;">
                            ${isCorrect ? '✅' : '❌'} Question ${index + 1}
                        </div>
                        <div style="font-size: 1.1rem; margin-bottom: 1rem;">${question.question}</div>
                        
                        ${question.options.map((option, optIndex) => {
                            let classes = 'review-option';
                            const optionLabel = String.fromCharCode(65 + optIndex);
                            const isUserAnswer = userAnswer === optIndex || userAnswer === optionLabel;
                            const isCorrectAnswer = correctAnswers.includes(optIndex) || correctAnswers.includes(optionLabel);
                            if (isUserAnswer && !isCorrect) {
                                classes += ' wrong-answer';
                            }
                            if (isCorrectAnswer) {
                                classes += ' correct-answer';
                            }
                            if (isUserAnswer && isCorrect) {
                                classes += ' user-answer correct-answer';
                            }

                            return `
                                <div class="${classes}">
                                    ${optionLabel}. ${typeof option === 'object' ? (option.text ?? option.label ?? '') : option}
                                    ${isUserAnswer ? ' (Your answer)' : ''}
                                    ${isCorrectAnswer ? ' ✓ Correct' : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                    });

                    reviewHTML += `
                <div style="text-align: center; margin-top: 2rem;">
                    <button class="btn btn-secondary" onclick="renderResults()">← Back to Results</button>
                </div>
            </div>`;

                    document.getElementById('quizContent').innerHTML = reviewHTML;
                }

                // Quiz Feedback Functions
                let selectedQuizRating = null;

                function selectQuizRating(rating) {
                    selectedQuizRating = rating;

                    // Update UI
                    const stars = document.querySelectorAll('.star-btn');
                    stars.forEach((star, index) => {
                        if (index < rating) {
                            star.style.background = 'linear-gradient(135deg, var(--accent), #00d4aa)';
                            star.style.borderColor = 'var(--accent)';
                            star.style.transform = 'scale(1.1)';
                        } else {
                            star.style.background = 'var(--bg-secondary)';
                            star.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                            star.style.transform = 'scale(1)';
                        }
                    });

                    // Enable submit button
                    const submitBtn = document.getElementById('submitQuizFeedbackBtn');
                    submitBtn.disabled = false;
                    submitBtn.style.cursor = 'pointer';
                    submitBtn.style.opacity = '1';
                }

                async function submitQuizFeedback() {
                    if (!selectedQuizRating) return;

                    const comment = document.getElementById('quizFeedbackComment').value.trim();
                    const apiBase = window.config?.apiBase || (window.location.origin + '/api');

                    try {
                        const response = await fetch(`${apiBase}/feedback/`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                source: 'quiz',
                                reference_id: quizData.quiz_id,
                                rating: selectedQuizRating.toString(),
                                subject: 'general',
                                comment: comment
                            })
                        });

                        if (!response.ok) {
                            throw new Error('Failed to submit feedback');
                        }

                        // Replace feedback UI with thank you message
                        document.getElementById('quizFeedbackContainer').innerHTML = `
                    <div style="text-align: center; color: var(--accent); font-size: 1.1rem;">
                        ✓ Thank you for your feedback!
                    </div>
                `;
                    } catch (error) {
                        alert(`Failed to submit feedback: ${error.message}`);
                    }
                }
            </script>
        </main>
    </div>

    <script>
        // Theme toggle
        function applyTheme(theme) {
            var btn = document.querySelector('.theme-toggle-btn i');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('lms_theme', 'dark');
                if (btn) { btn.classList.remove('fa-moon'); btn.classList.add('fa-sun'); }
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('lms_theme', 'light');
                if (btn) { btn.classList.remove('fa-sun'); btn.classList.add('fa-moon'); }
            }
        }
        function toggleTheme() {
            applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
        document.addEventListener('DOMContentLoaded', function () {
            applyTheme(localStorage.getItem('lms_theme') || 'light');
        });
    </script>
</body>

</html>
