  <!-- ═══ FORM MODAL ═══ -->
  <div class="lms-modal-overlay" id="formModal">
    <div class="lms-modal">
      <h2 id="formModalTitle">Form</h2>
      <div id="formModalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeFormModal()">Cancel</button>
        <button class="btn btn-primary" id="formModalSubmit">Save</button>

  <script>
    // ═══ BOOTSTRAP ═══
    const API = window.config?.apiBase || '/api';
    const session = window.routeGuard?.requireAuth({ roles: ['student', 'teacher', 'admin'] });
    if (!session) {
      throw new Error('Authentication required');
    }
    const token = session.token;
    const user = session.user || {};
    const ROLE = session.role;
    const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

    // Role guard: redirect pure students unless they came from dashboard with allow_student flag
    const _params = new URLSearchParams(location.search);
    if (ROLE === 'student' && !_params.has('allow_student')) {
      window.location.href = '/views/dashboard.html';
      throw new Error('Students must access via dashboard');
    }

    // Read initial route state from URL params.
    const _initialPage = _params.get('tab') || _params.get('page') || 'home';
    let activeClassId = _params.get('class_id') || '';
    let pendingAssignmentId = _params.get('assignment_id') || '';
    let pendingAssignmentAction = _params.get('assignment_action') || '';

    console.log('🚀 LMS Initializing:', { 
      role: ROLE, 
      page: _initialPage, 
      classId: activeClassId, 
      api: API,
      user: user.name 
    });

    function normalizeApiPayload(payload) {
      if (payload && typeof payload === 'object' && 'success' in payload && 'data' in payload) {
        return { success: !!payload.success, data: payload.data, error: payload.error || null };
      }
      return { success: true, data: payload, error: null };
    }

    function setRouteState(tab, classId) {
      const url = new URL(window.location.href);
      url.searchParams.set('tab', tab || 'home');
      if (classId) url.searchParams.set('class_id', classId);
      else url.searchParams.delete('class_id');
      url.searchParams.delete('assignment_id');
      url.searchParams.delete('assignment_action');
      window.history.replaceState({}, '', url.toString());
    }

    function unwrapPayload(payload) {
      return normalizeApiPayload(payload).data;
    }

    function formatDateLabel(value, options = {}) {
      if (!value) return 'TBD';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString('en-US', {
        weekday: options.weekday || undefined,
        month: options.month || 'short',
        day: options.day || 'numeric',
        year: options.year || undefined
      });
    }

    function formatTimeLabel(value) {
      if (!value) return 'Any time';
      if (String(value).includes('T')) {
        const date = new Date(value);
        if (!Number.isNaN(date.getTime())) {
          return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }
      }
      const [hour, minute] = String(value).split(':');
      const h = Number(hour);
      if (Number.isNaN(h)) return value;
      const suffix = h >= 12 ? 'PM' : 'AM';
      const normalized = ((h + 11) % 12) + 1;
      return `${normalized}:${minute || '00'} ${suffix}`;
    }

    function formatDateTimeLabel(dateValue, timeValue = '') {
      const date = formatDateLabel(dateValue, { weekday: 'short', month: 'short', day: 'numeric' });
      return timeValue ? `${date} · ${formatTimeLabel(timeValue)}` : date;
    }

    function formatRelativeTime(value) {
      if (!value) return 'Just now';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const diffMs = Date.now() - date.getTime();
      const diffMin = Math.round(diffMs / 60000);
      if (diffMin < 1) return 'Just now';
      if (diffMin < 60) return `${diffMin} min ago`;
      const diffHours = Math.round(diffMin / 60);
      if (diffHours < 24) return `${diffHours} hr${diffHours === 1 ? '' : 's'} ago`;
      const diffDays = Math.round(diffHours / 24);
      if (diffDays < 7) return `${diffDays} day${diffDays === 1 ? '' : 's'} ago`;
      return formatDateLabel(value, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function truncateAssignmentText(value, max = 140) {
      const text = String(value || '').trim();
      if (!text) return '';
      return text.length > max ? `${text.slice(0, max - 1)}…` : text;
    }

    function getStudentAssignmentState(assignment, submission) {
      const dueDate = assignment?.due_date ? new Date(assignment.due_date) : null;
      const dueValid = !!dueDate && !Number.isNaN(dueDate.getTime());
      const overdue = dueValid && dueDate.getTime() < Date.now() && !submission;
      const rawStatus = String(submission?.status || '').toLowerCase();
      const status = submission?.graded
        ? 'graded'
        : rawStatus === 'submitted'
          ? 'submitted'
          : rawStatus === 'graded'
            ? 'graded'
            : overdue
              ? 'overdue'
              : 'pending';

      const badge = {
        pending: { label: 'Pending', className: 'badge badge-purple' },
        overdue: { label: 'Overdue', className: 'badge badge-danger' },
        submitted: { label: 'Submitted', className: 'badge badge-sky' },
        graded: { label: 'Graded', className: 'badge badge-success' },
      }[status];

      return {
        status,
        badge,
        ctaLabel: submission ? 'Update Submission' : 'Submit Assignment',
        titlePrefix: submission ? 'Update' : 'Submit',
        dueLabel: assignment?.due_date ? formatDateLabel(assignment.due_date) : 'No due date',
        submittedLabel: submission?.submitted_at ? formatRelativeTime(submission.submitted_at) : '',
        scoreLabel: submission?.points_earned != null
          ? `${submission.points_earned}/${assignment.max_points || assignment.max_marks || 100}`
          : '',
        feedbackPreview: truncateAssignmentText(submission?.feedback, 120),
        contentPreview: truncateAssignmentText(submission?.content, 120),
        fileUrl: submission?.file_url || '',
      };
    }

    function consumeAssignmentIntent(items, submissionMap = {}) {
      if (ROLE !== 'student' || currentPage !== 'assignments' || !pendingAssignmentId) return;
      const target = items.find((item) => (item.id || item.assignment_id) === pendingAssignmentId);
      if (!target) return;

      const row = document.querySelector(`[data-assignment-id="${pendingAssignmentId}"]`);
      if (row) {
        row.style.borderLeft = '4px solid var(--accent)';
        row.style.background = 'color-mix(in oklab, var(--accent) 8%, var(--bg-card))';
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      const action = pendingAssignmentAction;
      pendingAssignmentId = '';
      pendingAssignmentAction = '';

      if (action === 'submit') {
        const submission = submissionMap[target.id || target.assignment_id] || null;
        setTimeout(() => openSubmitAssignment(target.id || target.assignment_id, target.title || 'Assignment', target, submission), 120);
      }
    }

    function getEventTone(type) {
      return ({ exam: 'danger', meeting: 'info', holiday: 'warning', general: 'accent' })[type] || 'accent';
    }

    function getAnnouncementTone(priority) {
      return ({ urgent: 'danger', important: 'warning', normal: 'accent' })[priority] || 'accent';
    }

    function openClassChat(classId = '') {
      const url = new URL('/views/subjects.html', window.location.origin);
      if (classId || activeClassId) url.searchParams.set('class_id', classId || activeClassId);
      window.location.href = url.toString();
    }

    function openLmsQuiz(quizId, classId = '') {
      const url = new URL('/views/lms_quiz.html', window.location.origin);
      url.searchParams.set('quiz_id', quizId);
      if (classId || activeClassId) url.searchParams.set('class_id', classId || activeClassId);
      window.location.href = url.toString();
    }

    function getWorkspaceHomeConfig() {
      if (ROLE === 'admin') {
        return { href: '/views/admin_portal.html', icon: 'fa-solid fa-shield-halved', label: 'Admin Portal' };
      }
      if (ROLE === 'teacher') {
        return { href: '/views/teacher_portal.html', icon: 'fa-solid fa-chalkboard-user', label: 'Teacher Portal' };
      }
      return { href: '/views/dashboard.html', icon: 'fa-solid fa-chart-line', label: 'Dashboard' };
    }

    // Set user info
    document.getElementById('navUserName').textContent = user.name || 'User';
    document.getElementById('navUserRole').textContent = window.routeGuard?.displayRole(ROLE) || ROLE;
    document.getElementById('navAvatar').textContent = (user.name || 'U')[0].toUpperCase();
    const workspaceHomeLink = document.getElementById('workspaceHomeLink');
    if (workspaceHomeLink) {
      const homeConfig = getWorkspaceHomeConfig();
      workspaceHomeLink.href = homeConfig.href;
      workspaceHomeLink.innerHTML = `<i class="${homeConfig.icon}" aria-hidden="true"></i> ${homeConfig.label}`;
    }

    // ═══ SIDEBAR MENU (Role-based) ═══
    const menuConfig = [
      {
        label: 'MENU', items: [
          { icon: '🏠', id: 'home', text: 'Home', roles: ['teacher', 'student', 'admin'] },
          { icon: '📚', id: 'classes', text: 'Classes', roles: ['teacher', 'student', 'admin'] },
          { icon: '👩‍🎓', id: 'students', text: 'Students', roles: ['teacher', 'admin'] },
          { icon: '📝', id: 'assignments', text: 'Assignments', roles: ['teacher', 'student', 'admin'] },
          { icon: '🧠', id: 'quizzes', text: 'Exams', roles: ['teacher', 'student', 'admin'] },
          { icon: '📊', id: 'results', text: 'Results', roles: ['teacher', 'student', 'admin'] },
          { icon: '✅', id: 'attendance', text: 'Attendance', roles: ['teacher', 'student', 'admin'] },
          { icon: '📅', id: 'events', text: 'Events', roles: ['teacher', 'student', 'admin'] },
          { icon: '📢', id: 'announcements', text: 'Announcements', roles: ['teacher', 'student', 'admin'] },
        ]
      },
      {
        label: 'OTHER', items: [
          { icon: '💬', id: 'chat', text: 'AI Chat', roles: ['teacher', 'student', 'admin'], href: '/views/subjects.html' },
          { icon: '📈', id: 'analytics', text: 'Analytics', roles: ['teacher', 'admin'], href: '/views/analytics.html' },
          { icon: '👤', id: 'profile', text: 'Profile', roles: ['teacher', 'student', 'admin'], href: '/views/profile.html' },
          { icon: '🚪', id: 'logout', text: 'Logout', roles: ['teacher', 'student', 'admin'] },
        ]
      }
    ];

    const iconMap = {
      home: { icon: 'fa-solid fa-chart-line', accent: 'sidebar-c1' },
      classes: { icon: 'fa-solid fa-book-open', accent: 'sidebar-c2' },
      students: { icon: 'fa-solid fa-user-group', accent: 'sidebar-c3' },
      assignments: { icon: 'fa-regular fa-pen-to-square', accent: 'sidebar-c4' },
      quizzes: { icon: 'fa-regular fa-circle-question', accent: 'sidebar-c5' },
      results: { icon: 'fa-regular fa-chart-bar', accent: 'sidebar-c6' },
      attendance: { icon: 'fa-regular fa-circle-check', accent: 'sidebar-c7' },
      events: { icon: 'fa-solid fa-calendar-days', accent: 'sidebar-c4' },
      announcements: { icon: 'fa-solid fa-bullhorn', accent: 'sidebar-c2' },
      chat: { icon: 'fa-solid fa-comments', accent: 'sidebar-c3' },
      analytics: { icon: 'fa-solid fa-chart-pie', accent: 'sidebar-c1' },
      profile: { icon: 'fa-regular fa-user', accent: 'sidebar-c6' },
      logout: { icon: 'fa-solid fa-right-from-bracket', accent: 'sidebar-c5' }
    };
    menuConfig.forEach((group) => group.items.forEach((item) => Object.assign(item, iconMap[item.id] || {})));

    const pageMeta = {
      home: { eyebrow: 'Overview', icon: 'fa-regular fa-chart-bar', title: 'LMS Workspace', subtitle: 'Track classes, coursework, events, and announcements from one cohesive dashboard shell.' },
      classes: { eyebrow: 'Classes', icon: 'fa-solid fa-book-open', title: 'Classes', subtitle: 'Browse sections, join codes, and class rosters with the same spacing and controls as the dashboard.' },
      students: { eyebrow: 'Students', icon: 'fa-solid fa-user-group', title: 'Students', subtitle: 'Review enrollment and student activity without leaving the LMS workspace.' },
      assignments: { eyebrow: 'Coursework', icon: 'fa-regular fa-pen-to-square', title: 'Assignments', subtitle: 'Create, review, and manage assignment work with consistent table and action patterns.' },
      quizzes: { eyebrow: 'Assessment', icon: 'fa-regular fa-circle-question', title: 'Exams', subtitle: 'Keep quizzes and exams aligned with the same card, badge, and action language.' },
      results: { eyebrow: 'Performance', icon: 'fa-regular fa-chart-bar', title: 'Results', subtitle: 'Compare class analytics and outcomes inside a cleaner reporting layout.' },
      attendance: { eyebrow: 'Attendance', icon: 'fa-regular fa-circle-check', title: 'Attendance', subtitle: 'Mark attendance and review trends in a simpler, more readable workspace.' },
      events: { eyebrow: 'Calendar', icon: 'fa-regular fa-calendar-days', title: 'Events', subtitle: 'Plan exams, meetings, holidays, and class milestones with a dashboard-aligned event view.' },
      announcements: { eyebrow: 'Communication', icon: 'fa-solid fa-bullhorn', title: 'Announcements', subtitle: 'Post updates in a clearer feed with the same typography, badges, and spacing system.' }
    };

    let currentPage = _initialPage;

    function buildSidebar() {
      const nav = document.getElementById('sidebarMenu');
      nav.innerHTML = menuConfig.map(group => {
        const items = group.items.filter(i => i.roles.includes(ROLE));
        if (!items.length) return '';
        return `<nav class="nav-section">
      <div class="nav-label">${group.label}</div>
      ${items.map(i => `<a class="nav-item ${i.id === currentPage ? 'active' : ''}" 
        data-page="${i.id}" ${i.href ? `data-href="${i.href}"` : ''} onclick="navTo('${i.id}', this)">
        <span class="nav-icon ${i.accent || 'sidebar-c1'}"><i class="${i.icon}" aria-hidden="true"></i></span>
        ${i.text}
      </a>`).join('')}
    </nav>`;
      }).join('');
    }

    function setPageHeader(page) {
      const meta = pageMeta[page] || pageMeta.home;
      const eyebrow = document.querySelector('.lms-page-eyebrow');
      const title = document.getElementById('pageTitle');
      const subtitle = document.getElementById('pageSubtitle');
      if (eyebrow) eyebrow.innerHTML = `<i class="${meta.icon}" aria-hidden="true"></i> ${meta.eyebrow}`;
      if (title) title.innerHTML = `<i class="${meta.icon}" aria-hidden="true"></i> ${meta.title}`;
      if (subtitle) subtitle.textContent = meta.subtitle;
    }

    function normalizeClassesIconography(area, isTeacher) {
      const searchIcon = area.querySelector('.table-search span');
      if (searchIcon) searchIcon.innerHTML = '<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>';

      const actionButton = area.querySelector('.table-header .btn.btn-primary');
      if (actionButton) {
        actionButton.innerHTML = isTeacher
          ? '<i class="fa-solid fa-plus" aria-hidden="true"></i> Create Class'
          : '<i class="fa-solid fa-plus" aria-hidden="true"></i> Join Class';
      }

      area.querySelectorAll("button.btn.btn-sm.btn-icon[onclick^=\"openEditClass(\"]").forEach((button) => {
        button.innerHTML = '<i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>';
        button.title = 'Edit class';
        button.setAttribute('aria-label', 'Edit class');
      });

      area.querySelectorAll("button.btn.btn-sm.btn-icon[onclick^=\"deleteClass(\"]").forEach((button) => {
        button.innerHTML = '<i class="fa-regular fa-trash-can" aria-hidden="true"></i>';
        button.title = 'Delete class';
        button.setAttribute('aria-label', 'Delete class');
      });

      area.querySelectorAll("button.btn.btn-sm.btn-icon[onclick^=\"viewStudents(\"]").forEach((button) => {
        button.innerHTML = '<i class="fa-solid fa-user-group" aria-hidden="true"></i>';
        button.title = 'View students';
        button.setAttribute('aria-label', 'View students');
      });

      area.querySelectorAll("button.btn.btn-sm.btn-primary[onclick*=\"loadPage('assignments'\"]").forEach((button) => {
        button.innerHTML = '<i class="fa-regular fa-eye" aria-hidden="true"></i> View';
      });
    }

    function normalizeQuizIconography(area, isTeacher) {
      const searchIcon = area.querySelector('.table-search span');
      if (searchIcon) searchIcon.innerHTML = '<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>';

      const createButton = area.querySelector('.table-header .btn.btn-primary');
      if (createButton && isTeacher) {
        createButton.innerHTML = '<i class="fa-solid fa-plus" aria-hidden="true"></i> New Quiz';
      }

      area.querySelectorAll("button.btn.btn-sm.btn-primary[onclick^=\"openLmsQuiz(\"]").forEach((button) => {
        button.innerHTML = isTeacher
          ? '<i class="fa-regular fa-eye" aria-hidden="true"></i> View Quiz'
          : '<i class="fa-regular fa-circle-question" aria-hidden="true"></i> Take Quiz';
      });
    }

    function normalizeAssignmentsIconography(area, isTeacher) {
      const searchIcon = area.querySelector('.table-search span');
      if (searchIcon) searchIcon.innerHTML = '<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>';

      const createButton = area.querySelector('.table-header .btn.btn-primary');
      if (createButton && isTeacher) {
        createButton.innerHTML = '<i class="fa-solid fa-plus" aria-hidden="true"></i> New Assignment';
      }

      area.querySelectorAll("button.btn.btn-sm.btn-primary[onclick^=\"openSubmitAssignment(\"]").forEach((button) => {
        const wantsUpdate = /update/i.test(button.textContent || '');
        button.innerHTML = wantsUpdate
          ? '<i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> Update Submission'
          : '<i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Submit Assignment';
      });

      area.querySelectorAll("button.btn.btn-sm.btn-secondary[onclick^=\"openViewSubmissions(\"]").forEach((button) => {
        button.innerHTML = '<i class="fa-regular fa-file-lines" aria-hidden="true"></i> Submissions';
      });

      area.querySelectorAll("button.btn.btn-sm.btn-secondary[onclick*=\"assignment_action=view\"]").forEach((button) => {
        button.innerHTML = '<i class="fa-regular fa-eye" aria-hidden="true"></i> Open';
      });
    }

    function navTo(page, el) {
      if (page === 'logout') { localStorage.clear(); window.location.href = '/views/login.html'; return; }
      const item = menuConfig.flatMap(g => g.items).find(i => i.id === page);
      if (item && item.href) {
        if (page === 'chat') {
          openClassChat(activeClassId);
          return;
        }
        window.location.href = item.href;
        return;
      }

      currentPage = page;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      loadPage(page, { classId: activeClassId, updateUrl: true });
    }

    // ═══ THEME ═══
    // ═══ TOAST ═══
    function toast(msg, type = 'success') {
      const wrap = document.getElementById('toastWrap');
      const t = document.createElement('div');
      t.className = 'lms-toast ' + type;
      t.textContent = msg;
      wrap.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    // ═══ FORM MODAL ═══
    function openFormModal(title, bodyHtml, onSubmit) {
      document.getElementById('formModalTitle').textContent = title;
      document.getElementById('formModalBody').innerHTML = bodyHtml;
      document.getElementById('formModalSubmit').onclick = onSubmit;
      document.getElementById('formModal').classList.add('open');
    }
    function closeFormModal() { document.getElementById('formModal').classList.remove('open'); }

    function showJoinClassModal() {
      openJoinClass();
    }

    // ═══ HELPERS ═══
    function escHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    async function apiFetch(url, opts = {}) {
      try {
        console.log(`🌐 API Request: ${API}${url}`, opts);
        const res = await fetch(API + url, { headers, ...opts });
        console.log(`📡 API Response: ${API}${url}`, res.status, res.statusText);
        
        if (res.status === 401) { 
          console.error('🔒 Authentication failed - redirecting to login');
          localStorage.clear(); 
          window.location.href = '/views/login.html'; 
          return null; 
        }
        
        if (!res.ok) {
          const errorText = await res.text();
          console.error(`❌ API Error ${res.status}:`, errorText);
          throw new Error(`API Error ${res.status}: ${res.statusText}`);
        }
        
        return res;
      } catch (e) { 
        console.error('🚨 Network error:', e);
        toast(`Network error: ${e.message}`, 'error'); 
        return null; 
      }
    }
    async function apiFetchCompat(urls, opts = {}) {
      const candidates = Array.isArray(urls) ? urls : [urls];
      let lastError = null;
      for (const url of candidates) {
        try {
          console.log(`🌐 API Request: ${API}${url}`, opts);
          const res = await fetch(API + url, { headers, ...opts });
          console.log(`📡 API Response: ${API}${url}`, res.status, res.statusText);

          if (res.status === 401) {
            console.error('🔒 Authentication failed - redirecting to login');
            localStorage.clear();
            window.location.href = '/views/login.html';
            return { response: null, url, data: null };
          }

          if (res.status === 404) {
            continue;
          }

          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`API Error ${res.status}: ${errorText || res.statusText}`);
          }

          const data = await res.json().catch(() => null);
          return { response: res, url, data };
        } catch (e) {
          lastError = e;
        }
      }
      if (lastError) {
        console.error('🚨 Compatibility fetch failed:', lastError);
      }
      return { response: null, url: null, data: null, error: lastError };
    }
    function formatMonthRange(month, year) {
      const start = new Date(year, month - 1, 1);
      const end = new Date(year, month, 0);
      const toIsoDay = (value) => `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, '0')}-${String(value.getDate()).padStart(2, '0')}`;
      return { start: toIsoDay(start), end: toIsoDay(end) };
    }
    function normalizeAnnouncementItems(payload) {
      const parsed = normalizeApiPayload(payload);
      const raw = Array.isArray(parsed?.data)
        ? parsed.data
        : (parsed?.data?.announcements || parsed?.data?.notices || []);
      return raw.map((item) => ({
        id: item.id || item.notice_id || item.update_id || '',
        title: item.title || 'Untitled announcement',
        body: item.body || item.content || '',
        content: item.content || item.body || '',
        priority: item.priority || 'normal',
        author_id: item.author_id || '',
        author_name: item.author_name || 'System',
        created_at: item.created_at || item.updated_at || '',
        updated_at: item.updated_at || item.created_at || '',
        delete_path: item.id ? `/announcements/${item.id}` : (item.notice_id ? `/comm/notices/${item.notice_id}` : null)
      }));
    }
    function normalizeEventItems(payload) {
      const parsed = normalizeApiPayload(payload);
      const raw = Array.isArray(parsed?.data) ? parsed.data : (parsed?.data?.events || []);
      return raw.map((item) => {
        const startValue = item.start || item.date || '';
        const [datePart, timePart = ''] = String(startValue).split('T');
        const cleanTime = item.time || timePart.slice(0, 5);
        const eventType = item.event_type || item.type || 'general';
        return {
          id: item.id || item.event_id || '',
          title: item.title || 'Untitled event',
          description: item.description || item.notes || '',
          date: item.date || datePart || '',
          time: cleanTime,
          event_type: eventType,
          author_id: item.author_id || item.user_id || '',
          author_name: item.author_name || (eventType ? eventType.replace(/^\w/, (c) => c.toUpperCase()) : 'Calendar'),
          delete_supported: Boolean(item.id && item.date)
        };
      });
    }
    async function fetchAnnouncementsFeed() {
      const result = await apiFetchCompat(['/announcements', '/comm/notices']);
      if (!result.response) return { items: [], mode: 'empty', url: null };
      return { items: normalizeAnnouncementItems(result.data), mode: result.url === '/announcements' ? 'announcements' : 'notices', url: result.url };
    }
    async function fetchEventsFeed(month, year) {
      const { start, end } = formatMonthRange(month, year);
      const result = await apiFetchCompat([`/events?month=${month}&year=${year}`, `/calendar/events?start_date=${start}&end_date=${end}`]);
      if (!result.response) return { items: [], mode: 'empty', url: null };
      return { items: normalizeEventItems(result.data), mode: result.url?.startsWith('/events?') ? 'events' : 'calendar', url: result.url };
    }

    async function drawTeacherCharts(cls) {
      const canvas = document.getElementById('attChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width = canvas.parentElement.clientWidth - 40;
      const H = canvas.height = 180;
      const analytics = await Promise.all(
        cls.slice(0, 5).map(async (c) => {
          const response = await apiFetch(`/lms/classes/${c.id}/analytics`);
          return { cls: c, stats: unwrapPayload(await response?.json()) || {} };
        })
      );
      const labels = analytics.map(({ cls }) => (cls.name || 'Class').slice(0, 10));
      const vals = analytics.map(({ stats }) => Math.round(Number(stats.attendance_pct || 0)));
      const barW = W / Math.max(labels.length, 1) - 16;
      const maxV = 100;
      ctx.clearRect(0, 0, W, H);
      labels.forEach((label, i) => {
        const x = i * (barW + 16) + 16;
        const h = (vals[i] / maxV) * (H - 30);
        ctx.fillStyle = '#C3EBFA';
        ctx.beginPath(); ctx.roundRect(x, H - h - 20, barW, h, 6); ctx.fill();
        ctx.fillStyle = '#6B7280';
        ctx.font = '11px Inter';
        ctx.textAlign = 'center';
        ctx.fillText(label, x + barW / 2, H - 4);
        ctx.fillStyle = '#1A1D26';
        ctx.font = '12px Inter';
        ctx.fillText(vals[i] + '%', x + barW / 2, H - h - 26);
      });

      const pc = document.getElementById('perfChart');
      if (!pc) return;
      const pctx = pc.getContext('2d');
      pc.width = pc.parentElement.clientWidth - 40;
      pc.height = 180;
      const cx = pc.width / 2, cy = 90, r = 60;
      const avgScores = analytics.map(({ stats }) => Number(stats.avg_quiz_score || stats.avg_score || 0));
      const pct = avgScores.length ? Math.round(avgScores.reduce((sum, value) => sum + value, 0) / avgScores.length) : 0;
      pctx.lineWidth = 14;
      pctx.strokeStyle = '#E4E7EC';
      pctx.beginPath(); pctx.arc(cx, cy, r, 0, Math.PI * 2); pctx.stroke();
      pctx.strokeStyle = '#4F46E5';
      pctx.lineCap = 'round';
      pctx.beginPath(); pctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (pct / 100) * Math.PI * 2); pctx.stroke();
      pctx.fillStyle = '#1A1D26';
      pctx.font = 'bold 24px Inter';
      pctx.textAlign = 'center';
      pctx.fillText(pct + '%', cx, cy + 8);
      pctx.font = '12px Inter';
      pctx.fillStyle = '#6B7280';
      pctx.fillText('Avg Score', cx, cy + 28);
    }

    function renderStudentSummaryCards(summary = {}, analyticsRows = [], rosterPayload = {}) {
      const total = Number(summary.total_students ?? rosterPayload.count ?? rosterPayload.students?.length ?? 0) || 0;
      const active = Number(summary.active_students_count ?? summary.active_students ?? analyticsRows.filter((item) => (item.quizzes_taken || 0) > 0 || item.attendance_pct != null).length ?? 0) || 0;
      const avgScore = Number(summary.avg_score ?? 0) || 0;
      const attendanceValues = analyticsRows.map((item) => Number(item.attendance_pct)).filter((value) => Number.isFinite(value));
      const avgAttendance = attendanceValues.length ? (attendanceValues.reduce((sum, value) => sum + value, 0) / attendanceValues.length) : 0;

      const setText = (id, value) => {
        const node = document.getElementById(id);
        if (node) node.textContent = value;
      };

      setText('studentStatTotal', String(total));
      setText('studentStatActive', String(active));
      setText('studentStatAvg', `${avgScore.toFixed(1).replace('.0', '')}%`);
      setText('studentStatAttendance', `${avgAttendance.toFixed(1).replace('.0', '')}%`);
      setText('studentStatTotalMeta', total ? `${total} learners enrolled right now` : 'No roster yet');
      setText('studentStatActiveMeta', active ? `${active} learners have recent attendance or quiz activity` : 'No recent activity yet');
      setText('studentStatAvgMeta', avgScore ? 'Updated from class quiz submissions' : 'No quiz submissions yet');
      setText('studentStatAttendanceMeta', avgAttendance ? 'Average from attendance records' : 'No attendance recorded yet');
    }

    async function loadStudentRosterWorkspace(classId, selectedClass = null) {
      const rosterMount = document.getElementById('studentsRosterCardBody');
      const analyticsMount = document.getElementById('studentsAnalyticsBody');
      if (rosterMount) rosterMount.innerHTML = '<div class="skeleton skeleton-chart"></div>';
      if (analyticsMount) analyticsMount.innerHTML = '<div class="skeleton skeleton-chart"></div>';
      renderStudentInviteResult();

      const [rosterRes, analyticsRes, summaryRes] = await Promise.all([
        apiFetch(`/lms/classes/${classId}/students`),
        apiFetch(`/lms/classes/${classId}/students/engagement`),
        apiFetch(`/lms/classes/${classId}/analytics`)
      ]);

      const rosterRaw = rosterRes ? await rosterRes.json() : null;
      const analyticsRaw = analyticsRes ? await analyticsRes.json() : null;
      const summaryRaw = summaryRes ? await summaryRes.json() : null;

      const rosterPayload = unwrapPayload(rosterRaw) || { class_id: classId, students: [], count: 0 };
      const analyticsPayload = unwrapPayload(analyticsRaw);
      const summaryPayload = unwrapPayload(summaryRaw) || summaryRaw || {};
      const analyticsRows = Array.isArray(analyticsPayload?.students) ? analyticsPayload.students : (Array.isArray(analyticsPayload) ? analyticsPayload : []);

      renderStudentSummaryCards(summaryPayload, analyticsRows, rosterPayload);
      renderStudentRosterTable(rosterPayload, classId);
      renderStudentAnalyticsTable(analyticsRows);

      const resultHint = selectedClass?.name
        ? `Adding a learner here updates the roster and analytics for ${selectedClass.name}.`
        : 'Add a learner to enroll them or create a class invite.';
      renderStudentInviteResult(null, resultHint);
    }

    async function submitStudentInvite() {
      const classId = activeClassId || document.getElementById('studentClassPick')?.value || '';
      if (!classId) {
        toast('Select a class first.', 'error');
        renderStudentInviteResult(null, 'Choose a class before adding students.');
        return;
      }

      const emailInput = document.getElementById('studentInviteEmail');
      const nameInput = document.getElementById('studentInviteName');
      const rollInput = document.getElementById('studentInviteRollNumber');
      const submitBtn = document.getElementById('studentInviteBtn');
      const student_email = (emailInput?.value || '').trim();
      const student_name = (nameInput?.value || '').trim();
      const student_roll_number = (rollInput?.value || '').trim();

      if (!student_email) {
        toast('Student email is required.', 'error');
        renderStudentInviteResult(null, 'Enter a student email to enroll an existing learner or create an invite link.');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Working...';
      }

      try {
        const response = await apiFetch(`/lms/classes/${classId}/students/invite`, {
          method: 'POST',
          body: JSON.stringify({ student_email, student_name, student_roll_number })
        });
        const payload = response ? normalizeApiPayload(await response.json()) : { success: false, error: 'No response' };

        if (!response?.ok || payload.success === false) {
          throw new Error(payload.error || 'Unable to add student right now.');
        }

        const resultData = payload.data || payload;
        if (emailInput) emailInput.value = '';
        if (nameInput) nameInput.value = '';
        if (rollInput) rollInput.value = '';
        toast(resultData.mode === 'enrolled_existing' ? 'Student enrolled successfully.' : 'Invite created successfully.');
        const classPick = document.getElementById('studentClassPick');
        const selectedClass = classPick ? { id: classId, name: classPick.options[classPick.selectedIndex]?.text || '' } : null;
        await loadStudentRosterWorkspace(classId, selectedClass);
        renderStudentInviteResult(resultData);
      } catch (error) {
        const message = error?.message || 'Unable to add student right now.';
        renderStudentInviteResult(null, message);
        toast(message, 'error');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Add student';
        }
      }
    }

      }
    }

      const state = getStudentAssignmentState(assignment || {}, existingSubmission);
      openFormModal(`${state.titlePrefix}: ${title}`, `

    async function loadClassResults(classId) {
      const cont = document.getElementById('resultsContent');

        apiFetch(`/lms/classes/${classId}/analytics`),
        apiFetch(`/lms/classes/${classId}/gradebook`)
      ]);
      const stats = unwrapPayload(await analyticsRes?.json().catch(() => ({}))) || {};
      const gradebook = unwrapPayload(await gradebookRes?.json().catch(() => ({}))) || {};
      const students = Array.isArray(gradebook.students) ? gradebook.students : [];
      const assignments = Array.isArray(gradebook.assignments) ? gradebook.assignments : [];
      const quizzes = Array.isArray(gradebook.quizzes) ? gradebook.quizzes : [];
      const formatPct = (value) => value == null ? 'N/A' : `${value}%`;

      cont.innerHTML = `
    <div class="stat-cards" style="margin-bottom:20px">
      <div class="stat-card"><div class="stat-icon">👩‍🎓</div><div class="stat-info"><div class="stat-value">${stats.total_students || 0}</div><div class="stat-label">Total Students</div></div></div>
      <div class="stat-card"><div class="stat-icon">🟢</div><div class="stat-info"><div class="stat-value">${stats.active_students || 0}</div><div class="stat-label">Active (7d)</div></div></div>
      <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-info"><div class="stat-value">${stats.avg_quiz_score || 0}%</div><div class="stat-label">Avg Quiz Score</div></div></div>
      <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-info"><div class="stat-value">${stats.attendance_pct || 0}%</div><div class="stat-label">Attendance</div></div></div>
    </div>
    <h3 style="font-size:15px;font-weight:700;margin:16px 0 8px">Class Gradebook (${students.length} students)</h3>
    <table class="lms-table"><thead><tr><th>Student</th><th>Assignments</th><th>Quizzes</th><th>Overall</th><th>Attendance</th><th>Progress</th></tr></thead>
    <tbody>${students.map(student => `<tr><td><strong>${escHtml(student.name || 'Unknown')}</strong><div class="text-muted" style="font-size:12px">${escHtml(student.email || '')}</div></td><td>${formatPct(student.assignment_average)}</td><td>${formatPct(student.quiz_average)}</td><td><span class="badge ${student.overall_percentage != null && student.overall_percentage >= 75 ? 'badge-success' : 'badge-info'}">${formatPct(student.overall_percentage)}</span></td><td>${formatPct(student.attendance_percentage)}</td><td class="text-muted" style="font-size:12px">${student.graded_assignments || 0}/${assignments.length} graded · ${student.completed_quizzes || 0}/${quizzes.length} quizzes</td></tr>`).join('') || '<tr><td colspan="6" class="text-muted" style="text-align:center">No graded work or quiz attempts yet.</td></tr>'}</tbody></table>`;
    }

        apiFetch('/lms/classes')
      ]);

      const quizzes = normalizeApiPayload(await quizRes?.json()).data || [];

      const assignments = normalizeApiPayload(await assignmentRes?.json()).data || [];

      const assignmentRows = Array.isArray(submissions) ? submissions : [];

        <div class="stat-value">${assignmentRows.length}</div>

      <article class="stat-card streak col-span-4">
        <div class="stat-label">Assignment average</div>

        <div class="stat-sub">From graded submissions only</div>
      </article>

    <div class="bento-grid">
      <article class="card col-span-7">
        <div class="card-header">
          <div class="card-title"><i class="fa-regular fa-circle-question"></i>Quiz Results</div>
          <div class="card-badge">${submittedQuizzes.length} recorded</div>
        </div>
        <div class="lms-table-wrap">
          <table class="lms-table">
            <thead><tr><th>Quiz</th><th>Class</th><th>Score</th><th>Status</th></tr></thead>
            <tbody>
              ${submittedQuizzes.map((quiz) => `
                <tr>
                  <td><strong>${escHtml(quiz.title || 'Quiz')}</strong></td>
                  <td>${escHtml(classMap[quiz.class_id]?.name || quiz.class_id || '-')}</td>
                  <td>${quiz.score == null ? 'N/A' : `${Number(quiz.score).toFixed(1)}%`}</td>
                  <td><span class="badge ${Number(quiz.score || 0) >= 75 ? 'badge-success' : 'badge-info'}">Submitted</span></td>
                </tr>`).join('') || '<tr><td colspan="4" class="text-muted" style="text-align:center;padding:40px">No LMS quiz attempts yet.</td></tr>'}
            </tbody>
          </table>
        </div>
      </article>

      <article class="card col-span-5">
        <div class="card-header">
          <div class="card-title"><i class="fa-regular fa-file-lines"></i>Assignment Results</div>
          <div class="card-badge">${assignmentRows.length} submissions</div>
        </div>
        <div style="display:grid; gap:12px;">
          ${assignmentRows.map((submission) => {
            const assignment = assignmentMap[submission.assignment_id] || {};
            const classInfo = classMap[submission.class_id || assignment.class_id] || {};
            return `
              <div class="announcement-item">
                <div class="ann-title">${escHtml(assignment.title || 'Assignment')}</div>
                <div class="ann-body">${escHtml(classInfo.name || submission.class_id || 'Class not found')}</div>
                <div class="ann-meta">
                  <span>${submission.graded ? `Graded: ${Number(submission.points_earned || 0).toFixed(1)} pts` : 'Pending grading'}</span>
                  <span>${submission.submitted_at ? formatRelativeTime(submission.submitted_at) : 'Recently submitted'}</span>
                </div>
              </div>`;
          }).join('') || '<div class="lms-empty-copy" style="margin:0;">No LMS assignment submissions yet.</div>'}
        </div>
      </article>
    </div>`;
    }

    function drawMiniCalendar(containerId) {
      const now = new Date();
      const year = now.getFullYear(), month = now.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = now.getDate();
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      let html = '<div class="mini-cal-grid">';
      dayNames.forEach(d => html += `<div class="day-header">${d}</div>`);
      for (let i = 0; i < firstDay; i++) html += '<div class="day-cell empty"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === today ? 'today' : '';
        const hasEvt = _eventDates.has(d) ? 'has-event' : '';
        html += `<div class="day-cell ${isToday} ${hasEvt}">${d}</div>`;
      }
      html += '</div>';
      document.getElementById(containerId).innerHTML = html;
    }

        <div class="lms-feed-header">
          <div>
            <div class="lms-section-kicker">Message center</div>
            <h2>Announcements</h2>
          </div>
          ${isTeacher ? '<button class="btn btn-primary" onclick="openCreateAnnouncement()"><i class="fa-solid fa-pen" aria-hidden="true"></i> Post</button>' : ''}
        </div>
        <div class="lms-summary-strip" id="announcementSummaryStrip">
          <div class="lms-mini-stat"><span>0</span><small>Total posts</small></div>
          <div class="lms-mini-stat"><span>0</span><small>Urgent</small></div>
          <div class="lms-mini-stat"><span>0</span><small>Important</small></div>
        </div>
        <div class="lms-note-card">
          <h3>Keep this feed focused</h3>
          <p>Use announcements for schedule changes, exam reminders, and class-wide updates so students can scan the essentials quickly.</p>
        </div>
      </section>

      <section class="card col-span-8 lms-feed-shell">
        <div class="lms-feed-header">
          <div>
            <div class="lms-section-kicker">Latest updates</div>
            <h2>Class announcements</h2>
          </div>
          <span class="lms-feed-count" id="announcementCountPill">Loading...</span>
        </div>
        <div id="annFeed" class="lms-announcement-list"><div class="skeleton skeleton-chart"></div></div>
      </section>
    </div>`;
      await loadAnnouncements();
    }

    async function loadAnnouncements() {
      const feed = document.getElementById('annFeed');
      if (!feed) return;

      try {
        const { items: anns, mode } = await fetchAnnouncementsFeed();
        const countPill = document.getElementById('announcementCountPill');
        if (countPill) countPill.textContent = `${anns.length} posts`;

        const summaryStrip = document.getElementById('announcementSummaryStrip');
        if (summaryStrip) {
          const urgentCount = anns.filter((a) => a.priority === 'urgent').length;
          const importantCount = anns.filter((a) => a.priority === 'important').length;
          summaryStrip.innerHTML = `
            <div class="lms-mini-stat"><span>${anns.length}</span><small>Total posts</small></div>
            <div class="lms-mini-stat"><span>${urgentCount}</span><small>Urgent</small></div>
            <div class="lms-mini-stat"><span>${importantCount}</span><small>Important</small></div>
          `;
        }

        if (!anns.length) {
          feed.innerHTML = `<div class="empty-state lms-empty-panel">
          <div class="empty-icon"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i></div>
          <h3>No announcements yet</h3>
          <p>New updates will appear here once they are posted for your classes.</p>
        </div>`;
          return;
        }

        const isTeacher = ROLE === 'teacher' || ROLE === 'admin';
        feed.innerHTML = anns.map((a) => {
          const tone = getAnnouncementTone(a.priority || 'normal');
          const ownAnnouncement = String(a.author_id || '') === String(user._id || user.id || '');
          const badgeTone = tone === 'accent' ? 'info' : tone;
          return `<article class="lms-announcement-card lms-tone-${tone}">
        <div class="lms-announcement-head">
          <div>
            <div class="ann-title">${escHtml(a.title || 'Untitled announcement')}</div>
            <div class="ann-meta">By ${escHtml(a.author_name || 'System')} · ${formatRelativeTime(a.created_at)}${mode === 'notices' ? ' · Notice board' : ''}</div>
          </div>
          <span class="badge badge-${badgeTone}">${escHtml((a.priority || 'normal').replace(/^\w/, (c) => c.toUpperCase()))}</span>
        </div>
        <div class="ann-body">${escHtml(a.content || a.body || '')}</div>
        <div class="lms-item-meta">
          <span>${formatDateLabel(a.created_at || a.updated_at, { month: 'short', day: 'numeric', year: 'numeric' })}</span>
          ${isTeacher && a.delete_path && (ownAnnouncement || ROLE === 'admin') ? `<button class="btn btn-sm btn-danger" onclick="deleteAnnouncement('${a.id}')"><i class="fa-regular fa-trash-can" aria-hidden="true"></i> Delete</button>` : ''}
        </div>
      </article>`;
        }).join('');
      } catch (e) {
        feed.innerHTML = `<div class="empty-state lms-empty-panel">
        <div class="empty-icon"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i></div>
        <h3>Unable to load announcements</h3>
        <p>The feed could not be loaded right now. Refresh once and try again.</p>
      </div>`;
      }
    }

    function openCreateAnnouncement() {
      openFormModal('Post Announcement', `
    <div class="form-group"><label>Title</label><input id="fAnnTitle" required placeholder="Announcement title"></div>
    <div class="form-group"><label>Content</label><textarea id="fAnnContent" rows="4" placeholder="Write your message here..."></textarea></div>
    <div class="form-group"><label>Priority</label><select id="fAnnPriority"><option value="normal">Normal</option><option value="important">Important</option><option value="urgent">Urgent</option></select></div>
  `, async () => {
        const body = {
          title: document.getElementById('fAnnTitle').value,
          body: document.getElementById('fAnnContent').value,
          priority: document.getElementById('fAnnPriority').value
        };
        if (!body.title) { toast('Title required', 'error'); return; }
        let res = await apiFetch('/announcements', { method: 'POST', body: JSON.stringify(body) });
        if (!res && body.body) {
          res = await apiFetch('/comm/notices', { method: 'POST', body: JSON.stringify({ title: body.title, content: body.body, priority: body.priority }) });
        }
        if (res?.ok) { toast('Announcement posted!'); closeFormModal(); loadPage('announcements'); }
        else { const d = await res?.json().catch(() => ({})); toast(d.detail || 'Failed to post', 'error'); }
      });
    }

    // ═══ VIEW SUBMISSIONS + GRADE (Teacher) ═══
    async function openViewSubmissions(assignmentId, title) {
      const res = await apiFetch('/lms/submissions');
      const all = await res?.json();
      const subs = (Array.isArray(all) ? all : []).filter(s => s.assignment_id === assignmentId);
      openFormModal(`📋 ${title} — Submissions (${subs.length})`, `
    <table class="lms-table" style="font-size:13px">
      <thead><tr><th>Student</th><th>Status</th><th>Score</th><th>Action</th></tr></thead>
      <tbody>${subs.map(s => `<tr>
        <td><strong>${escHtml(s.student_name || s.student_email || 'Unknown')}</strong><br><span style="font-size:11px;color:var(--lms-muted)">${escHtml(s.student_email || '')}</span></td>
        <td><span class="badge badge-${s.graded ? 'success' : s.status === 'submitted' ? 'sky' : 'purple'}">${s.status || 'pending'}</span></td>
        <td>${s.points_earned != null ? s.points_earned + ' pts' : '—'}</td>
        <td style="display:flex;gap:6px">
          ${s.file_url ? `<a href="${s.file_url}" target="_blank" class="btn btn-sm btn-secondary">📎</a>` : ''}
          ${s.content ? `<button class="btn btn-sm btn-secondary" onclick="alert('Answer:\\n'+${JSON.stringify(s.content || '')})">👁</button>` : ''}
          <button class="btn btn-sm btn-primary" onclick="openGradeModal('${s.id}','${escHtml(s.student_name || s.student_email || 'Student')}','${s.points_earned || 0}')">Grade</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="4" class="text-muted" style="text-align:center;padding:20px">No submissions yet.</td></tr>'}
      </tbody>
    </table>`, () => closeFormModal());
      document.getElementById('formModalTitle').textContent = `${title} — Submissions (${subs.length})`;
      document.getElementById('formModalSubmit').innerHTML = '<i class="fa-solid fa-xmark" aria-hidden="true"></i> Close';
      document.querySelectorAll('#formModalBody a.btn.btn-sm.btn-secondary').forEach((button) => {
        button.innerHTML = '<i class="fa-solid fa-paperclip" aria-hidden="true"></i>';
        button.title = 'Open attachment';
        button.setAttribute('aria-label', 'Open attachment');
      });
      document.querySelectorAll('#formModalBody button.btn.btn-sm.btn-secondary').forEach((button) => {
        button.innerHTML = '<i class="fa-regular fa-eye" aria-hidden="true"></i>';
        button.title = 'View answer';
        button.setAttribute('aria-label', 'View answer');
      });
      document.querySelectorAll('#formModalBody button.btn.btn-sm.btn-primary').forEach((button) => {
        button.innerHTML = '<i class="fa-regular fa-pen-to-square" aria-hidden="true"></i> Grade';
      });
    }

    let _gradeSubId = null;
    function openGradeModal(subId, studentName, currentScore) {
      _gradeSubId = subId;
      openFormModal(`🏅 Grade: ${studentName}`, `
    <div class="form-group"><label>Score (points)</label><input type="number" id="fGradeScore" value="${currentScore || 0}" min="0" max="999"></div>
    <div class="form-group"><label>Feedback (optional)</label><textarea id="fGradeFeedback" placeholder="Provide feedback to student..."></textarea></div>
  `, async () => {
        const score = parseFloat(document.getElementById('fGradeScore').value);
        const feedback = document.getElementById('fGradeFeedback').value;
        if (isNaN(score)) { toast('Enter a valid score', 'error'); return; }
        const res = await apiFetch('/lms/submissions/grade', { method: 'POST', body: JSON.stringify({ submission_id: _gradeSubId, points_earned: score, feedback }) });
        if (res?.ok) { toast('✅ Graded successfully!'); closeFormModal(); }
        else { const d = await res?.json().catch(() => ({})); toast(d.detail || 'Grading failed', 'error'); }
      });
      document.getElementById('formModalSubmit').textContent = '✅ Submit Grade';
    }

    // ═══ TABLE FILTER UTILITY ═══
    function filterTable(tableId, q) {
      const rows = document.querySelectorAll(`#${tableId} tbody tr`);
      rows.forEach(r => { r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none'; });
    }

    // ═══ INIT ═══
    buildSidebar();
    resetLmsScroll();
    loadPage(_initialPage, { classId: activeClassId, updateUrl: true });
    loadNotificationBadge('notifBadge');
  </script>
</body>

</html>
