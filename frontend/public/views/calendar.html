<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Calendar - RAG AI Tutor</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-bg: #151921;
            --accent: #00ffcc;
            --secondary: #7000ff;
            --text-main: #e0e0e0;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        .calendar-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .calendar-day-label {
            background: var(--card-bg);
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .calendar-cell {
            background: var(--card-bg);
            min-height: 120px;
            padding: 0.5rem;
            transition: background 0.2s;
            position: relative;
        }

        .calendar-cell:hover {
            background: #1c212b;
        }

        .calendar-cell.today {
            background: rgba(0, 255, 204, 0.05);
        }

        .day-number {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            display: block;
        }

        .today .day-number {
            color: var(--accent);
            font-weight: 700;
        }

        .event-item {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .event-task { background: rgba(112, 0, 255, 0.2); border-left-color: var(--secondary); color: #d8b4fe; }
        .event-assignment { background: rgba(255, 68, 68, 0.2); border-left-color: #ff4444; color: #fca5a5; }
        .event-quiz { background: rgba(0, 255, 204, 0.2); border-left-color: var(--accent); color: #99f6e4; }
        .event-class { background: rgba(59, 130, 246, 0.2); border-left-color: #3b82f6; color: #93c5fd; }

        .sidebar-calendar {
            width: 250px;
            padding: 1.5rem;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .calendar-content {
            flex: 1;
            padding: 2rem;
        }

        .btn-nav {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-nav:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body class="dark-theme">
    <div class="main-layout">
        <!-- SIDEBAR -->
        <div class="sidebar-calendar">
            <h2 style="color: var(--accent); margin-bottom: 2rem;">RAG Tutor</h2>
            <nav>
                <ul style="list-style: none; padding: 0;">
                    <li style="margin-bottom: 1rem;"><a href="/views/dashboard.html" style="color: var(--text-dim); text-decoration: none;">🏠 Dashboard</a></li>
                    <li style="margin-bottom: 1rem;"><a href="/views/calendar.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">📅 Calendar</a></li>
                    <li style="margin-bottom: 1rem;"><a href="/views/subjects.html" style="color: var(--text-dim); text-decoration: none;">💬 AI Chat</a></li>
                </ul>
            </nav>
            <div style="margin-top: 4rem; padding: 1rem; background: rgba(112,0,255,0.1); border-radius: 8px;">
                <h4 style="margin:0; font-size: 0.8rem; color: var(--accent);">Legend</h4>
                <div style="margin-top: 0.5rem; font-size: 0.7rem;">
                    <div style="display:flex; align-items:center; margin-bottom: 4px;"><span style="width:10px; height:10px; background:#7000ff; border-radius:2px; margin-right:8px;"></span> Tasks</div>
                    <div style="display:flex; align-items:center; margin-bottom: 4px;"><span style="width:10px; height:10px; background:#ff4444; border-radius:2px; margin-right:8px;"></span> Assignments</div>
                    <div style="display:flex; align-items:center; margin-bottom: 4px;"><span style="width:10px; height:10px; background:#00ffcc; border-radius:2px; margin-right:8px;"></span> Quizzes</div>
                    <div style="display:flex; align-items:center;"><span style="width:10px; height:10px; background:#3b82f6; border-radius:2px; margin-right:8px;"></span> Classes</div>
                </div>
            </div>
        </div>

        <div class="calendar-content">
            <div class="calendar-header">
                <h1 id="currentMonthYear">March 2026</h1>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn-nav" onclick="prevMonth()">←</button>
                    <button class="btn-nav" onclick="goToToday()">Today</button>
                    <button class="btn-nav" onclick="nextMonth()">→</button>
                </div>
            </div>

            <div class="calendar-grid" id="calendarGrid">
                <!-- Day Labels -->
                <div class="calendar-day-label">Sun</div>
                <div class="calendar-day-label">Mon</div>
                <div class="calendar-day-label">Tue</div>
                <div class="calendar-day-label">Wed</div>
                <div class="calendar-day-label">Thu</div>
                <div class="calendar-day-label">Fri</div>
                <div class="calendar-day-label">Sat</div>
                <!-- Cells injected by JS -->
            </div>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script>
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let events = [];

        async function fetchEvents() {
            try {
                const start = new Date(currentYear, currentMonth, 1).toISOString().split('T')[0];
                const end = new Date(currentYear, currentMonth + 1, 0).toISOString().split('T')[0];
                
                const response = await fetch(`${CONFIG.API_BASE_URL}/calendar/events?start_date=${start}&end_date=${end}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                events = await response.json();
                renderCalendar();
            } catch (err) {
                console.error("Failed to fetch events", err);
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthYearLabel = document.getElementById('currentMonthYear');
            
            // Clear existing cells (keep labels)
            const labels = Array.from(grid.querySelectorAll('.calendar-day-label'));
            grid.innerHTML = '';
            labels.forEach(l => grid.appendChild(l));

            const monthName = new Intl.DateTimeFormat('en-US', { month: 'long' }).format(new Date(currentYear, currentMonth));
            monthYearLabel.innerText = `${monthName} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date();
            today.setHours(0,0,0,0);

            // Padding for first week
            for (let i = 0; i < firstDay; i++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell empty';
                grid.appendChild(cell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell';
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const cellDate = new Date(currentYear, currentMonth, day);
                if (cellDate.getTime() === today.getTime()) cell.classList.add('today');

                cell.innerHTML = `<span class="day-number">${day}</span>`;
                
                // Add events for this day
                const dayEvents = events.filter(e => e.start.startsWith(dateStr));
                dayEvents.forEach(e => {
                    const el = document.createElement('div');
                    el.className = `event-item event-${e.type}`;
                    el.innerText = e.title;
                    el.title = e.title;
                    cell.appendChild(el);
                });

                grid.appendChild(cell);
            }
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            fetchEvents();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            fetchEvents();
        }

        function goToToday() {
            currentMonth = new Date().getMonth();
            currentYear = new Date().getFullYear();
            fetchEvents();
        }

        // Initial fetch
        fetchEvents();
    </script>
</body>
</html>
