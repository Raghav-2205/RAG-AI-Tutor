<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - RAG AI Tutor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0e27; color: #e0e6ed; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .navbar { height: 70px; background: #0d112d; border-bottom: 1px solid rgba(0,255,204,0.15); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; }
        .brand { color: #00ffcc; font-weight: 700; font-size: 1.2rem; }
        .nav-links { display: flex; gap: 12px; align-items: center; }
        .nav-links a, .nav-links button { background: rgba(0,255,204,0.1); border: 1px solid rgba(0,255,204,0.2); color: #00ffcc; padding: 8px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 0.9rem; transition: all 0.2s; }
        .nav-links a:hover, .nav-links button:hover { background: rgba(0,255,204,0.2); }
        .logout-btn { border-color: #ff4444 !important; color: #ff4444 !important; background: rgba(255,68,68,0.1) !important; }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        h1 { color: #00ffcc; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .subtitle { color: #888; margin-bottom: 2rem; }

        .tab-bar { display: flex; gap: 4px; margin-bottom: 2rem; background: rgba(30,35,62,0.6); padding: 4px; border-radius: 12px; }
        .tab { flex: 1; text-align: center; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; color: #888; transition: all 0.2s; }
        .tab.active { background: rgba(0,255,204,0.15); color: #00ffcc; }
        .tab:hover { color: #e0e6ed; }

        .section { display: none; }
        .section.active { display: block; }

        .section-title { color: #b8c5d6; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; margin: 1.5rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }

        .card { background: rgba(30,35,62,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; transition: all 0.3s; animation: fadeIn 0.4s ease-out; }
        .card:hover { border-color: rgba(0,255,204,0.2); }
        .card h3 { color: #e0e6ed; margin-bottom: 0.5rem; }
        .card p { color: #b8c5d6; font-size: 0.9rem; line-height: 1.5; }
        .card-meta { display: flex; gap: 12px; margin-top: 10px; font-size: 0.8rem; color: #888; }

        .priority-urgent { border-left: 3px solid #ff4444; }
        .priority-high { border-left: 3px solid #ffaa44; }
        .priority-normal { border-left: 3px solid #00ffcc; }
        .priority-low { border-left: 3px solid #6666ff; }

        .category-badge { display: inline-block; background: rgba(0,255,204,0.1); color: #00ffcc; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; }

        .btn { background: linear-gradient(135deg, #00ffcc, #00d4aa); color: #0f0c29; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,255,204,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #e0e6ed; border: 1px solid rgba(255,255,255,0.2); }
        .btn-small { font-size: 0.8rem; padding: 6px 14px; }

        .post-form { background: rgba(30,35,62,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .post-form input, .post-form textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px; color: #fff; margin-bottom: 10px; font-size: 0.9rem; }
        .post-form textarea { min-height: 70px; resize: vertical; }

        .reply-box { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px; margin-top: 10px; }
        .reply-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .reply-item:last-child { border-bottom: none; }
        .reply-author { color: #00ffcc; font-size: 0.85rem; font-weight: 600; }
        .reply-content { color: #b8c5d6; font-size: 0.9rem; }

        .like-btn { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #888; transition: all 0.2s; }
        .like-btn:hover { background: rgba(255,68,100,0.1); color: #ff6688; border-color: rgba(255,68,100,0.3); }

        .reply-form { display: flex; gap: 8px; margin-top: 10px; }
        .reply-form input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 8px; color: #fff; }

        .tag { display: inline-block; background: rgba(138,43,226,0.15); color: #d1a3ff; padding: 2px 8px; border-radius: 8px; font-size: 0.75rem; margin-right: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">🗣️ Community</div>
        <div class="nav-links">
            <a href="/views/subjects.html">💬 AI Chat</a>
            <a href="/views/planner.html">📅 Planner</a>
            <a href="/views/dashboard.html">📊 Dashboard</a>
            <button class="logout-btn" onclick="localStorage.clear(); window.location.href='/views/login.html';">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1>Community Hub</h1>
        <p class="subtitle">Notice board, updates & forum</p>

        <div class="tab-bar">
            <div class="tab active" onclick="switchTab('notices')">📢 Notices</div>
            <div class="tab" onclick="switchTab('updates')">📰 Updates</div>
            <div class="tab" onclick="switchTab('forum')">💬 Forum</div>
        </div>

        <!-- NOTICES -->
        <div id="notices-section" class="section active">
            <div id="noticesList"><p style="color:#888">Loading notices...</p></div>
        </div>

        <!-- UPDATES -->
        <div id="updates-section" class="section">
            <div id="updatesList"><p style="color:#888">Loading updates...</p></div>
        </div>

        <!-- FORUM -->
        <div id="forum-section" class="section">
            <div class="post-form">
                <h3 style="color:#00ffcc;margin-bottom:10px;">New Discussion</h3>
                <input id="forumTitle" placeholder="Discussion title" />
                <textarea id="forumContent" placeholder="Share your thoughts..."></textarea>
                <input id="forumTags" placeholder="Tags (comma-separated)" />
                <button class="btn" onclick="createForumPost()">Post</button>
            </div>
            <div id="forumList"><p style="color:#888">Loading forum...</p></div>
        </div>
    </div>

    <script src="/assets/js/config.js?v=7"></script>
    <script>
        const API = window.config?.apiBase || 'http://127.0.0.1:8002/api';
        const TOKEN = localStorage.getItem('token');
        const USER = JSON.parse(localStorage.getItem('user') || '{}');
        const headers = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
        if (!TOKEN) window.location.href = '/views/login.html';

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(`${name}-section`).classList.add('active');
        }

        async function loadNotices() {
            try {
                const res = await fetch(`${API}/comm/notices`, { headers });
                const notices = await res.json();
                const html = notices.map(n => `<div class="card priority-${n.priority || 'normal'}">
                    <h3>${n.title}</h3>
                    <p>${n.content}</p>
                    <div class="card-meta">
                        <span>By ${n.author_name || 'Admin'}</span>
                        <span>${n.author_role || ''}</span>
                        <span>${new Date(n.created_at).toLocaleDateString()}</span>
                        <span class="category-badge">${n.priority || 'normal'}</span>
                    </div>
                </div>`).join('');
                document.getElementById('noticesList').innerHTML = html || '<p style="color:#888;text-align:center;">No notices posted yet.</p>';
            } catch (err) { console.error(err); }
        }

        async function loadUpdates() {
            try {
                const res = await fetch(`${API}/comm/updates`, { headers });
                const updates = await res.json();
                const html = updates.map(u => `<div class="card">
                    <h3>${u.title}</h3>
                    <p>${u.content}</p>
                    <div class="card-meta">
                        <span>By ${u.author_name || 'System'}</span>
                        <span>${new Date(u.created_at).toLocaleDateString()}</span>
                        <span class="category-badge">${u.category}</span>
                    </div>
                </div>`).join('');
                document.getElementById('updatesList').innerHTML = html || '<p style="color:#888;text-align:center;">No updates posted.</p>';
            } catch (err) { console.error(err); }
        }

        async function loadForum() {
            try {
                const res = await fetch(`${API}/comm/forum/posts`, { headers });
                const posts = await res.json();
                const html = posts.map(p => {
                    const tags = (p.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
                    const replies = (p.replies || []).map(r => `<div class="reply-item">
                        <div class="reply-author">${r.author_name || 'Anonymous'} <span style="color:#888;font-weight:400">(${r.author_role || ''})</span></div>
                        <div class="reply-content">${r.content}</div>
                    </div>`).join('');

                    return `<div class="card">
                        <h3>${p.title}</h3>
                        <p>${p.content}</p>
                        <div class="card-meta">
                            <span>${p.author_name || 'Anonymous'} (${p.author_role || ''})</span>
                            <span>${new Date(p.created_at).toLocaleDateString()}</span>
                            <span class="like-btn" onclick="likePost('${p.post_id}')">❤️ ${p.likes || 0}</span>
                            ${tags}
                        </div>
                        ${replies ? `<div class="reply-box"><div class="section-title">Replies</div>${replies}</div>` : ''}
                        <div class="reply-form">
                            <input id="reply-${p.post_id}" placeholder="Write a reply..." />
                            <button class="btn btn-small" onclick="replyToPost('${p.post_id}')">Reply</button>
                        </div>
                    </div>`;
                }).join('');
                document.getElementById('forumList').innerHTML = html || '<p style="color:#888;text-align:center;">No discussions yet. Start one above!</p>';
            } catch (err) { console.error(err); }
        }

        async function createForumPost() {
            const title = document.getElementById('forumTitle').value;
            const content = document.getElementById('forumContent').value;
            const tags = document.getElementById('forumTags').value.split(',').map(t => t.trim()).filter(Boolean);
            if (!title || !content) { alert('Title and content required'); return; }

            await fetch(`${API}/comm/forum/posts`, {
                method: 'POST', headers,
                body: JSON.stringify({ title, content, tags })
            });
            document.getElementById('forumTitle').value = '';
            document.getElementById('forumContent').value = '';
            document.getElementById('forumTags').value = '';
            loadForum();
        }

        async function replyToPost(postId) {
            const content = document.getElementById(`reply-${postId}`).value;
            if (!content) return;
            await fetch(`${API}/comm/forum/reply`, {
                method: 'POST', headers,
                body: JSON.stringify({ post_id: postId, content })
            });
            document.getElementById(`reply-${postId}`).value = '';
            loadForum();
        }

        async function likePost(postId) {
            await fetch(`${API}/comm/forum/posts/${postId}/like`, { method: 'POST', headers });
            loadForum();
        }

        // Load all tabs
        loadNotices();
        loadUpdates();
        loadForum();
    </script>
</body>
</html>
