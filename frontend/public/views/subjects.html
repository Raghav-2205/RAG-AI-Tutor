<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG AI Tutor · AI Study Console</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/ai-study-console.css?v=1" />
</head>

<body>
    <header class="asc-topbar">
        <div class="asc-brand" aria-label="RAG AI Tutor">
            <div class="asc-brand__name">RAG AI Tutor</div>
            <div class="asc-brand__sub">AI Study Console</div>
        </div>
        <div class="asc-topbar__actions">
            <button class="btn icon-btn" id="sidebarToggle" type="button" aria-label="Open sessions sidebar"
                aria-controls="sidebar" aria-expanded="false" title="Sessions">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16" />
                    <path d="M4 12h16" />
                    <path d="M4 17h16" />
                </svg>
            </button>
            <button class="btn btn--danger" id="logoutBtn" type="button">Logout</button>
        </div>
    </header>

    <div class="asc-shell" id="appShell" data-sidebar-open="false">
        <aside class="asc-sidebar" id="sidebar" aria-label="Chat sessions sidebar">
            <div class="asc-sidebar__header">
                <div class="asc-sidebar__title">Sessions</div>
                <button class="btn btn--primary" id="newChatBtn" type="button">New</button>
            </div>

            <label class="field" aria-label="Search sessions">
                <span aria-hidden="true">⌕</span>
                <input id="sessionSearch" type="search" placeholder="Search chats…" autocomplete="off" />
            </label>

            <div class="asc-sessionlist" id="sessionList" role="list" aria-label="Session list">
                <div class="skeleton" style="height: 56px; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 56px; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 56px; margin-bottom: 10px;"></div>
            </div>

            <div style="display:flex; gap: 8px;">
                <a class="btn icon-btn" href="/views/dashboard.html" title="Dashboard" aria-label="Dashboard">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 19V5" />
                        <path d="M4 19H20" />
                        <path d="M8 16V12" />
                        <path d="M12 16V9" />
                        <path d="M16 16V6" />
                    </svg>
                </a>
                <button class="btn icon-btn" id="uploadBtn" type="button" title="Upload document"
                    aria-label="Upload document">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                        <path d="M14 3v5h5" />
                        <path d="M12 17V11" />
                        <path d="M9.5 13.5 12 11l2.5 2.5" />
                    </svg>
                </button>
                <button class="btn icon-btn btn--danger" id="clearDocsBtn" type="button" title="Clear all documents"
                    aria-label="Clear all documents">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6h18" />
                        <path d="M8 6V4h8v2" />
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                    </svg>
                </button>
            </div>
        </aside>

        <main class="asc-main" aria-label="Chat panel">
            <section class="asc-chat" id="chatScroll" aria-label="Chat messages">
                <div class="asc-chat__inner" id="chatFeed" role="log" aria-live="polite" aria-relevant="additions text"
                    aria-atomic="false">
                    <div class="empty-state" id="emptyState">
                        <h1>What do you want to learn?</h1>
                        <p>Ask a question, upload a document for grounded study, or pick an existing session on the left.</p>
                        <div style="display:flex; gap: 10px; justify-content:center; flex-wrap: wrap;">
                            <button class="btn btn--primary" id="emptyNewChatBtn" type="button">Start a new chat</button>
                            <button class="btn" id="emptyUploadBtn" type="button">Upload a document</button>
                        </div>
                    </div>
                </div>
            </section>

            <form class="asc-composer" id="composer" aria-label="Message composer">
                <div class="asc-composer__inner">
                    <textarea id="chatInput" class="asc-textarea" rows="1" placeholder="Message RAG AI Tutor…"
                        aria-label="Message input"></textarea>
                    <button id="sendBtn" class="asc-send" type="submit" aria-label="Send message">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M22 2 11 13" />
                            <path d="M22 2 15 22 11 13 2 9z" />
                        </svg>
                    </button>
                </div>
            </form>
        </main>
    </div>

    <input type="file" id="hiddenFileInput" accept=".pdf,.docx,.txt,.pptx,.jpg,.png" style="display:none" />

    <!-- Confirmation modal -->
    <div class="modal" id="confirmModal" aria-hidden="true" role="dialog" aria-modal="true"
        aria-labelledby="confirmTitle">
        <div class="modal__card">
            <div class="modal__head">
                <div class="modal__title" id="confirmTitle">Confirm</div>
                <button class="btn icon-btn" id="confirmClose" type="button" aria-label="Close dialog">✕</button>
            </div>
            <div class="modal__body">
                <p id="confirmMessage" style="margin:0 0 16px; color: rgba(255,255,255,0.78);">Are you sure?</p>
                <div style="display:flex; gap: 10px; justify-content:flex-end; flex-wrap: wrap;">
                    <button class="btn" id="confirmCancel" type="button">Cancel</button>
                    <button class="btn btn--danger" id="confirmOk" type="button">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Citation modal -->
    <div class="modal" id="citationModal" aria-hidden="true" role="dialog" aria-modal="true"
        aria-labelledby="citationTitle">
        <div class="modal__card">
            <div class="modal__head">
                <div class="modal__title" id="citationTitle">Citation</div>
                <button class="btn icon-btn" id="citationClose" type="button" aria-label="Close dialog">✕</button>
            </div>
            <div class="modal__body" id="citationBody"></div>
        </div>
    </div>

    <!-- Markdown parser for beautiful formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <script src="/assets/js/config.js?v=7"></script>
    <script src="/assets/js/auth.js?v=7"></script>
    <script src="/assets/js/ai.js?v=7"></script>
    <script type="module" src="/src/chat/chat-ui.js?v=1"></script>

</body>

</html>
