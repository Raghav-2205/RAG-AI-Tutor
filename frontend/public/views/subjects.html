<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAG AI Tutor - Workspace</title>

<style>
/* ================= BASE ================= */
* { box-sizing: border-box; }
body {
    margin: 0;
    height: 100vh;
    background: #0a0e27;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #e0e6ed;
}

/* ================= NAVBAR ================= */
.navbar {
    height: 70px;
    background: #0d112d;
    border-bottom: 1px solid rgba(0,255,204,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
}
.brand {
    color: #00ffcc;
    font-weight: 700;
    font-size: 1.2rem;
}

/* ================= LAYOUT ================= */
.dashboard-container {
    flex: 1;
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 70px);
}

/* ================= SIDEBAR ================= */
.sidebar {
    background: rgba(13,17,45,0.95);
    border-right: 1px solid rgba(0,255,204,0.15);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.sidebar-section h3 {
    font-size: 0.75rem;
    color: #b8c5d6;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
}
.nav-item {
    padding: 0.75rem 1rem;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
}
.nav-item:hover {
    background: rgba(0,255,204,0.1);
    color: #00ffcc;
}

/* ================= MAIN ================= */
.main-workspace {
    position: relative;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at center, #1a1f3a, #0a0e27);
}

/* ================= CHAT ================= */
.chat-feed {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 20%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding-bottom: 140px;
}
.msg {
    padding: 1rem 1.2rem;
    border-radius: 16px;
    max-width: 80%;
}
.msg.user {
    align-self: flex-end;
    background: #2a2f4a;
}
.msg.ai {
    align-self: flex-start;
    background: rgba(255,255,255,0.05);
}

/* ================= INPUT ================= */
.input-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 2rem 20%;
    background: linear-gradient(to top, #0a0e27 80%, transparent);
}
.input-box {
    background: #1e233e;
    border-radius: 24px;
    padding: 12px;
    display: flex;
    gap: 10px;
}
textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    resize: none;
    outline: none;
    font-size: 1rem;
}
.send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: #00ffcc;
    color: #000;
    font-weight: bold;
}

/* ================= QUIZ MODAL ================= */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,14,39,0.9);
    backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-card {
    background: #1e233e;
    border-radius: 24px;
    padding: 2rem;
    width: 90%;
    max-width: 600px;
}
.quiz-option {
    background: rgba(255,255,255,0.05);
    padding: 1rem;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 0.6rem;
}
.quiz-option.correct { background: rgba(0,255,100,0.2); }
.quiz-option.wrong { background: rgba(255,68,68,0.2); }
</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
    <div class="brand">RAG AI Tutor</div>
    <button style="background:none;border:1px solid #ff4444;color:#ff4444;padding:6px 16px;border-radius:20px;">
        Logout
    </button>
</nav>

<!-- ================= DASHBOARD ================= -->
<div class="dashboard-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="nav-item" onclick="resetChat()">➕ New Chat</div>

        <div class="sidebar-section">
            <h3>Tools</h3>
            <div class="nav-item" onclick="openQuizModal()">📝 Generate Quiz</div>
        </div>

        <div class="sidebar-section">
            <h3>Subjects</h3>
            <div class="nav-item">⚛️ Physics</div>
            <div class="nav-item">🧬 Biology</div>
            <div class="nav-item">💻 CS</div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main-workspace">

        <div id="chatFeed" class="chat-feed">
            <h1 style="text-align:center;color:#00ffcc;margin-top:20vh;">
                What do you want to learn?
            </h1>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="chatInput" rows="1" placeholder="Message RAG AI Tutor..."></textarea>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

    </main>
</div>

<!-- ================= QUIZ MODAL ================= -->
<div id="quizModal" class="modal-overlay">
    <div class="modal-card">
        <h2 style="color:#00ffcc;margin-top:0;">AI Quiz Generator</h2>

        <div id="quizArea"></div>

        <button onclick="closeQuiz()" style="margin-top:1rem;">
            Close
        </button>
    </div>
</div>

<!-- ================= SCRIPT ================= -->
<script>
/* ========== CHAT ========== */
function resetChat() {
    document.getElementById('chatFeed').innerHTML =
        '<h1 style="text-align:center;color:#00ffcc;margin-top:20vh;">New Conversation</h1>';
}

function sendMessage() {
    const input = document.getElementById('chatInput');
    if (!input.value.trim()) return;

    const userMsg = document.createElement('div');
    userMsg.className = 'msg user';
    userMsg.textContent = input.value;

    document.getElementById('chatFeed').appendChild(userMsg);

    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg ai';
    aiMsg.textContent = "This is a frontend demo response.";
    document.getElementById('chatFeed').appendChild(aiMsg);

    input.value = '';
}

/* ========== QUIZ ========== */
const quizData = [
    {
        q: "What does RAG stand for?",
        options: ["Retrieval Augmented Generation", "Random AI Generator", "Real-time Agent Graph"],
        correct: 0
    },
    {
        q: "Which component retrieves documents?",
        options: ["LLM", "Retriever", "Tokenizer"],
        correct: 1
    }
];

let quizIndex = 0;
let score = 0;

function openQuizModal() {
    document.getElementById('quizModal').style.display = 'flex';
    quizIndex = 0;
    score = 0;
    renderQuiz();
}

function closeQuiz() {
    document.getElementById('quizModal').style.display = 'none';
}

function renderQuiz() {
    const area = document.getElementById('quizArea');
    area.innerHTML = '';

    if (quizIndex >= quizData.length) {
        area.innerHTML = `
            <h3>Quiz Complete 🎉</h3>
            <p style="color:#00ffcc;">Score: ${score}/${quizData.length}</p>
        `;
        return;
    }

    const q = quizData[quizIndex];
    area.innerHTML = `<h3>${q.q}</h3>`;

    q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'quiz-option';
        div.textContent = opt;
        div.onclick = () => checkAnswer(i, q.correct, div);
        area.appendChild(div);
    });
}

function checkAnswer(selected, correct, el) {
    const opts = document.querySelectorAll('.quiz-option');
    opts.forEach(o => o.style.pointerEvents = 'none');

    if (selected === correct) {
        el.classList.add('correct');
        score++;
    } else {
        el.classList.add('wrong');
        opts[correct].classList.add('correct');
    }

    setTimeout(() => {
        quizIndex++;
        renderQuiz();
    }, 800);
}
</script>

</body>
</html>
