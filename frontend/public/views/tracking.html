<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Tracking — RAG AI Tutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-primary:   #0a0e27;
            --bg-secondary: #151932;
            --bg-card:      #1a1f3a;
            --accent:       #00ffcc;
            --text-primary: #ffffff;
            --text-muted:   #b8c5d6;
            --border:       rgba(0, 255, 204, 0.2);
            --radius:       16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: var(--accent); margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; margin-bottom: 2rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-muted); font-size: 0.9rem; }
        select, input, textarea {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); border-radius: 10px; color: #fff;
            font-family: inherit; font-size: 1rem;
        }
        
        .btn {
            background: var(--accent); color: var(--bg-primary);
            border: none; padding: 12px 24px; border-radius: 10px;
            font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,255,204,0.3); }

        .history-list { margin-top: 2rem; }
        .history-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 12px;
            margin-bottom: 0.8rem; border: 1px solid rgba(255,255,255,0.05);
        }
        .item-info { display: flex; align-items: center; gap: 1rem; }
        .item-icon { font-size: 1.5rem; background: rgba(0,255,204,0.1); width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
        .item-title { font-weight: 600; font-size: 1.1rem; }
        .item-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        nav { margin-bottom: 2rem; }
        nav a { color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <nav><a href="/views/dashboard.html">← Back to Dashboard</a></nav>
        <h1>🏃 Activity Tracking</h1>
        <p class="subtitle">Log your daily progress and let AI help you improve.</p>

        <div class="card">
            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option value="study">📚 Study</option>
                    <option value="workout">🏋️ Workout</option>
                    <option value="food">🍱 Food</option>
                    <option value="mind">🧘 Mind</option>
                </select>
            </div>
            <div class="form-group">
                <label>Title / Description</label>
                <input type="text" id="title" placeholder="e.g. 5km Run, Chapter 3 Review">
            </div>
            <div class="form-group" id="metricsGroup">
                <!-- Dynamic inputs based on category -->
            </div>
            <button class="btn" onclick="saveActivity()">Log Activity</button>
        </div>

        <h2>History</h2>
        <div class="history-list" id="historyList">
            <!-- Loaded by JS -->
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script>
        const API = window.config?.apiBase || 'http://127.0.0.1:8002/api';
        const TOKEN = localStorage.getItem('token');
        const headers = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };

        const categorySelect = document.getElementById('category');
        categorySelect.addEventListener('change', updateMetricsFields);

        function updateMetricsFields() {
            const cat = categorySelect.value;
            const group = document.getElementById('metricsGroup');
            group.innerHTML = '';

            if (cat === 'workout') {
                group.innerHTML = `
                    <label>Duration (min)</label>
                    <input type="number" id="duration" class="metric-input" style="margin-bottom:1rem">
                    <label>Calories Burned</label>
                    <input type="number" id="calories" class="metric-input">
                `;
            } else if (cat === 'food') {
                group.innerHTML = `
                    <label>Total Calories</label>
                    <input type="number" id="calories" class="metric-input" style="margin-bottom:1rem">
                    <label>Meal Type</label>
                    <input type="text" id="meal_type" class="metric-input" placeholder="Breakfast, Lunch, etc.">
                `;
            } else {
                group.innerHTML = `
                    <label>Duration (min)</label>
                    <input type="number" id="duration" class="metric-input">
                `;
            }
        }

        async function saveActivity() {
            const cat = categorySelect.value;
            const title = document.getElementById('title').value;
            const metrics = {};
            document.querySelectorAll('.metric-input').forEach(input => {
                metrics[input.id] = input.id === 'meal_type' ? input.value : parseInt(input.value) || 0;
            });

            const data = {
                date: new Date().toISOString().split('T')[0],
                category: cat,
                data: { title, ...metrics, topics: cat === 'study' ? [title] : [] }
            };

            const res = await fetch(`${API}/planner/activities`, {
                method: 'POST', headers, body: JSON.stringify(data)
            });

            if (res.ok) {
                document.getElementById('title').value = '';
                loadHistory();
            }
        }

        async function loadHistory() {
            const res = await fetch(`${API}/planner/activities`, { headers });
            const activities = await res.json();
            const list = document.getElementById('historyList');
            const icons = { study: '📚', workout: '🏋️', food: '🍱', mind: '🧘' };
            
            list.innerHTML = activities.slice(0, 10).map(a => `
                <div class="history-item">
                    <div class="item-info">
                        <div class="item-icon">${icons[a.category]}</div>
                        <div>
                            <div class="item-title">${a.data.title || a.category}</div>
                            <div class="item-meta">${a.date}</div>
                        </div>
                    </div>
                    <div style="text-align:right">
                        ${a.data.duration_min ? `<span>⏱️ ${a.data.duration_min}m</span>` : ''}
                        ${a.data.calories || a.data.calories_burned ? `<div style="font-size:0.8rem;color:var(--accent)">🔥 ${a.data.calories || a.data.calories_burned} kcal</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        updateMetricsFields();
        loadHistory();
    </script>
</body>
</html>
