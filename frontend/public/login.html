<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLearnHub - Login</title>
  <link rel="stylesheet" href="../src/css/main.css">
  <link rel="stylesheet" href="../src/css/components.css">
</head>
<body>
  <main class="container auth-page">
    <section class="glass-card auth-card">
      <div class="auth-header">
        <h2>Welcome back</h2>
        <p class="mb-0">Login to continue learning.</p>
      </div>

      <div class="form-toggle" role="tablist" aria-label="Auth toggle">
        <div class="toggle-slider" style="transform: translateX(0%);"></div>
        <a class="toggle-option active" href="login.html" role="tab" aria-selected="true">Login</a>
        <a class="toggle-option" href="signup.html" role="tab" aria-selected="false">Signup</a>
      </div>

      <form data-auth-form="login">
        <div class="input-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div data-auth-status class="auth-status"></div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>

        <button type="button" class="oauth-btn" onclick="alert('Hook Google OAuth here')">
          <span>G</span>
          <span>Continue with Google</span>
        </button>
      </form>

      <p class="auth-footer">New here? <a href="signup.html">Create an account</a></p>
      <p class="auth-links"><a href="index.html">Back to Home</a> · <a href="subjects.html">Subjects</a></p>
    </section>
  </main>

  <script src="../src/js/auth.js"></script>
</body>
</html>
