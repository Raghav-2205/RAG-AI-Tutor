<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLearnHub - RAG AI Tutor Chat</title>
  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header glass-dark">
      <a href="/" class="chat-back">← Home</a>
      <h1 class="chat-title">RAG AI Tutor</h1>
      <p class="chat-subtitle">Ask anything — Socratic tutoring powered by AI</p>
    </header>

    <div class="chat-messages" id="chatMessages">
      <div class="message ai welcome-msg" id="welcomeMsg">
        <p>Hi! I'm your RAG AI Tutor. Ask a question and I'll help you think through it.</p>
        <span class="message-time">Just now</span>
      </div>
    </div>

    <div class="chat-input-container">
      <input type="text" class="chat-input" id="chatInput" placeholder="Type your question..." autocomplete="off" maxlength="8000">
      <button type="button" class="chat-send-btn" id="sendBtn" aria-label="Send">
        <span>➤</span>
      </button>
    </div>
    <div class="chat-status" id="chatStatus"></div>
  </div>

  <script src="/src/js/auth.js"></script>
  <script src="/src/js/chat_utils.js"></script>
</body>
</html>
