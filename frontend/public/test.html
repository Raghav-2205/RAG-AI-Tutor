<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RAG AI Tutor - Debug Test</title>
  <link rel="stylesheet" href="assets/css/ai-study-console.css?v=1">
  <style>
    body {
      font-family: var(--font-body);
      padding: var(--space-5);
      background: var(--color-bg);
      color: var(--color-text);
      overflow: auto;
    }
    .test-result {
      margin: var(--space-2) 0;
      padding: var(--space-3);
      border-radius: var(--radius-1);
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
    }
    .success { border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.10); }
    .error { border-color: rgba(255, 107, 107, 0.35); background: rgba(255, 107, 107, 0.10); }
    .info { border-color: rgba(64, 214, 214, 0.25); background: rgba(64, 214, 214, 0.08); }
    button {
      padding: 10px 14px;
      margin: 5px;
      background: linear-gradient(135deg, rgba(64, 214, 214, 0.18), rgba(64, 214, 214, 0.10));
      color: var(--color-text);
      border: 1px solid rgba(64, 214, 214, 0.35);
      border-radius: var(--radius-pill);
      cursor: pointer;
      font: inherit;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }
    button:hover { background: rgba(255,255,255,0.07); border-color: var(--color-border-strong); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <h1>RAG AI Tutor - Debug Test</h1>
  
  <div id="results"></div>
  
  <button onclick="testAPI()">Test API Connection</button>
  <button onclick="testViews()">Test View Loading</button>
  <button onclick="testAuth()">Test Auth Endpoints</button>
  <button onclick="location.href='/'">Go to Main App</button>

  <script>
    function addResult(message, type = 'info') {
      const results = document.getElementById('results');
      const div = document.createElement('div');
      div.className = `test-result ${type}`;
      div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
      results.appendChild(div);
    }

    async function testAPI() {
      addResult('Testing API connection...', 'info');
      
      try {
        // Test health endpoint
        const healthResponse = await fetch('http://127.0.0.1:8000/health');
        if (healthResponse.ok) {
          const healthData = await healthResponse.json();
          addResult(`✅ Health check passed: ${healthData.status}`, 'success');
        } else {
          addResult(`❌ Health check failed: ${healthResponse.status}`, 'error');
        }
        
        // Test API root
        const apiResponse = await fetch('http://127.0.0.1:8000/api/');
        if (apiResponse.ok) {
          const apiData = await apiResponse.json();
          addResult(`✅ API root accessible: ${apiData.message}`, 'success');
        } else {
          addResult(`❌ API root failed: ${apiResponse.status}`, 'error');
        }
        
      } catch (error) {
        addResult(`❌ API test error: ${error.message}`, 'error');
      }
    }

    async function testViews() {
      addResult('Testing view loading...', 'info');
      
      const views = ['home', 'login', 'signup', 'subjects'];
      
      for (const view of views) {
        try {
          const response = await fetch(`views/${view}.html`);
          if (response.ok) {
            const html = await response.text();
            addResult(`✅ View ${view} loaded (${html.length} chars)`, 'success');
          } else {
            addResult(`❌ View ${view} failed: ${response.status}`, 'error');
          }
        } catch (error) {
          addResult(`❌ View ${view} error: ${error.message}`, 'error');
        }
      }
    }

    async function testAuth() {
      addResult('Testing auth endpoints...', 'info');
      
      try {
        // Test registration endpoint (should return validation error)
        const response = await fetch('http://127.0.0.1:8000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: 'test@example.com',
            password: 'testpass123',
            full_name: 'Test User'
          })
        });
        
        if (response.status === 200 || response.status === 201) {
          addResult('✅ Auth registration endpoint working', 'success');
        } else if (response.status === 400 || response.status === 422) {
          addResult('✅ Auth registration endpoint accessible (validation error expected)', 'success');
        } else {
          addResult(`❌ Auth registration failed: ${response.status}`, 'error');
        }
        
      } catch (error) {
        addResult(`❌ Auth test error: ${error.message}`, 'error');
      }
    }

    // Auto-run basic tests on load
    document.addEventListener('DOMContentLoaded', () => {
      addResult('Debug page loaded', 'info');
      testAPI();
    });
  </script>
</body>
</html>
